/* ───────── sheets ───────── */
function setField(label,f,val,step,mode,ph){
  return '<label class="fld" for="set-'+f+'">'+label+'</label><div class="stp">'+
    '<button class="btn sec" data-act="setStep" data-f="'+f+'" data-d="-'+step+'" aria-label="Decrease '+esc(label)+'">−</button>'+
    '<input class="inp" id="set-'+f+'" data-in="setf" data-f="'+f+'" inputmode="'+mode+'" enterkeyhint="done" autocomplete="off" value="'+esc(val)+'" placeholder="'+esc(ph)+'">'+
    '<button class="btn sec" data-act="setStep" data-f="'+f+'" data-d="'+step+'" aria-label="Increase '+esc(label)+'">+</button></div>';
}
function sheetHTML(still){
  var sh=ui.sheet;if(!sh)return '';
  var s=sess();
  var h='<div class="backdrop'+(still?' still':'')+'" data-act="closeSheetBg"><div class="sheet" role="dialog" aria-modal="true">';
  if(sh.type==='conflict'){
    var cr=syncUI.conflict;
    if(!cr)return '';
    var nLocal=Object.keys(state.sessions).length,nRemote=Object.keys(cr.state.sessions||{}).length;
    h+='<h2>Two versions of your data</h2><p class="small muted">This device and the cloud have both changed since they last matched. Pick the one to keep. The other is replaced.</p>'+
      '<button class="opt" data-act="useCloud"><span>Use the cloud version<small>Changed '+esc(fmtStamp(cr.savedAt))+' · '+nRemote+' workout'+(nRemote===1?'':'s')+'. Replaces this device (a copy is kept on it).</small></span></button>'+
      '<button class="opt" data-act="useDevice"><span>Keep this device<small>Changed '+esc(fmtStamp(state.updatedAt||0))+' · '+nLocal+' workout'+(nLocal===1?'':'s')+'. Replaces the cloud (the gist history keeps the old one).</small></span></button>'+
      '<button class="btn ghost block" data-act="closeSheet">Decide later</button>';
  }else if(sh.type==='add'&&(s||sh.isNew)){
    h+='<h2>'+(sh.isNew?(sh.date<today()?'Log a past workout':'Start a workout'):'Add groups to this workout')+'</h2>';
    if(!state.groups.length)h+='<p class="muted">Create a group first in the Groups tab.</p>';
    state.groups.forEach(function(g){
      var on=sh.isNew?sh.sel.indexOf(g.id)>=0:s.groupIds.indexOf(g.id)>=0;
      h+='<button class="opt'+(on?' on':'')+'" data-act="addGroupPick" data-id="'+g.id+'"><span>'+esc(g.name||'Untitled')+'<small class="pv">'+esc(preview(g))+'</small></span><b>'+(on?'✓':'')+'</b></button>';
    });
    if(sh.isNew){
      h+='<div class="row" style="margin-top:6px"><button class="btn grow" data-act="startConfirm"'+(sh.sel.length?'':' disabled style="opacity:.5"')+'>'+(sh.date<today()?'Log workout':'Start workout')+'</button><button class="btn ghost" data-act="closeSheet">Cancel</button></div>';
    }else h+='<button class="btn block" data-act="closeSheet">Done</button>';
  }else if(sh.type==='swap'&&s){
    var f=findNode(sh.node);
    if(f){
      var picked=s.picks[sh.node]||[];
      var alts=f.node.children.filter(function(c){return picked.indexOf(c.id)<0;});
      h+='<h2>Do something else instead</h2>';
      alts.forEach(function(c){h+='<button class="opt" data-act="swapPick" data-new="'+c.id+'"><span>'+esc(c.name||'Untitled')+'<small>'+esc(c.kind==='group'?'Group':(c.target||''))+'</small></span></button>';});
      if(picked.length>(f.node.pick||1))h+='<button class="opt" data-act="swapRemove"><span>Remove this one from the workout</span></button>';
      h+='<button class="btn ghost block" data-act="closeSheet">Cancel</button>';
    }
  }else if(sh.type==='grpMenu'&&s){
    var mf=findNode(sh.node);
    h+='<h2>'+esc((mf&&mf.node.name)||'Group')+'</h2>'+
      '<button class="opt" data-act="grpRemoveConfirm"><span>Remove from this workout</span></button>'+
      '<button class="btn ghost block" data-act="closeSheet">Cancel</button>';
  }else if(sh.type==='hist'&&(s||sh.g)){
    var hf=findNode(sh.ex),hnode=hf&&hf.node,hh=history(sh.ex,sh.before),hmk={partial:'½ ',skipped:'– '};
    h+='<h2>'+esc((hnode&&hnode.name)||'History')+'</h2><p class="small muted" style="margin:0">'+hh.length+' earlier workout'+(hh.length===1?'':'s')+'</p>'+histChart(hh)+
      '<ul class="hl">'+hh.map(function(x){return '<li><time>'+esc(histDate(x.date))+'</time><span>'+esc(histWas(x,hnode)+(hmk[x.status]||'')+x.note)+'</span></li>';}).join('')+'</ul>'+
      '<button class="btn ghost block" data-act="closeSheet">Close</button>';
  }else if(sh.type==='set'&&s){
    var sf=findNode(sh.ex),cnt=setsOf(s,sh.ex).length;
    h+='<h2>Set '+(sh.i>=0?sh.i+1:cnt+1)+(sf&&sf.node.name?' <span class="muted" style="font-weight:400">· '+esc(sf.node.name)+'</span>':'')+'</h2>';
    if(sh.timed)h+=setField('Time','t',sh.t,5,'numeric','0:45');
    else h+=setField('Reps','r',sh.r,1,'numeric','')+setField('Weight (lb)','w',sh.w,5,'decimal','Bodyweight');
    h+='<button class="btn block" style="margin-top:16px" data-act="setSave">Save</button>'+
      '<div class="row" style="margin-top:8px">'+(sh.i>=0?'<button class="btn danger grow" data-act="setDel">Remove set</button>':'')+'<button class="btn ghost grow" data-act="closeSheet">Cancel</button></div>';
  }else if(sh.type==='pick'&&s){
    var pf=findNode(sh.node);
    if(pf){
      var cur=s.picks[sh.node]||[];
      h+='<h2>What did you do in '+esc(pf.node.name||'this group')+'?</h2>';
      pf.node.children.forEach(function(c){
        var on=cur.indexOf(c.id)>=0;
        h+='<button class="opt'+(on?' on':'')+'" data-act="togglePick" data-child="'+c.id+'"><span>'+esc(c.name||'Untitled')+'<small>'+esc(c.kind==='group'?'Group':(c.target||''))+'</small></span><b>'+(on?'✓':'')+'</b></button>';
      });
      h+='<button class="btn block" data-act="closeSheet">Done</button>';
    }
  }
  return h+'</div></div>';
}

/* ───────── render ───────── */
function currentView(){
  if(ui.tab==='today')return ui.open?sessionView():todayView();
  if(ui.tab==='groups')return ui.editGroup?editorView():(ui.viewGroup&&getGroup(ui.viewGroup))?groupView():groupsView();
  if(ui.tab==='settings')return settingsView();
  return historyView();
}
function render(){
  var key=ui.tab+'|'+(ui.open||'')+'|'+(ui.editGroup||'')+'|'+(ui.viewGroup||'')+'|'+(ui.tab==='today'&&!ui.open?ui.date:'');
  var y=window.scrollY,same=key===ui.viewKey;
  var root=document.getElementById('sheet-root'),oldSheet=root.querySelector('.sheet');
  var still=!!oldSheet,sy=oldSheet?oldSheet.scrollTop:0;
  document.getElementById('app').innerHTML=currentView();
  root.innerHTML=sheetHTML(still);
  var newSheet=root.querySelector('.sheet');if(newSheet&&still)newSheet.scrollTop=sy;
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'),function(b){
    b.classList.toggle('on',b.dataset.tab===ui.tab);
  });
  ui.viewKey=key;
  window.scrollTo(0,same?y:0);
  if(ui.focus){
    var el=document.querySelector('[data-in="name"][data-node="'+ui.focus+'"]');
    if(el){el.focus();if(el.select)el.select();}
    ui.focus=null;
  }
  if(ui.focusProg){
    var pe=document.querySelector('[data-in="prog"][data-node="'+ui.focusProg+'"]');
    if(pe)pe.focus();
    ui.focusProg=null;
  }
  syncWake();
}
var toastTimer=null;
function toast(msg){
  var r=document.getElementById('toast-root');
  r.innerHTML='<div id="toast" role="status">'+esc(msg)+'</div>';
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){r.innerHTML='';},2600);
}

/* ───────── actions ───────── */
function setLog(s,id,patch){
  var f=treeFind(s,id)||(findNode(id)||{}).node;
  var l=s.logs[id]||{};
  Object.keys(patch).forEach(function(k){if(patch[k]===null)delete l[k];else l[k]=patch[k];});
  if(f)l.name=f.name;
  if(!l.status&&!String(l.note||'').trim()&&!hasSets(l))delete s.logs[id];else s.logs[id]=l;
}
function allLeaves(s){
  var out=[];s.groupIds.forEach(function(id){var g=groupFor(s,id);if(g)out=out.concat(leavesOf(g,s.picks));});return out;
}
function markAllLeaves(s){allLeaves(s).forEach(function(l){if(!(s.logs[l.id]&&s.logs[l.id].status))setLog(s,l.id,{status:'done'});});}
function dropLogsFor(s,node){leavesOf(node,s.picks).forEach(function(l){delete s.logs[l.id];});}

function removeGroup(s,id){
  if(s.groupIds.indexOf(id)<0)return;
  var g=groupFor(s,id);
  var any=g&&leavesOf(g,s.picks).some(function(l){var x=s.logs[l.id];return x&&(x.status||String(x.note||'').trim());});
  if(any&&!confirm('This group has logged exercises. Remove it and discard them?'))return;
  if(g)dropLogsFor(s,g);
  s.groupIds=s.groupIds.filter(function(x){return x!==id;});
  if(s.tree)delete s.tree[id];
  if(s.snap)delete s.snap[id];
  refresh(s);save();render();
}

var ACTIONS={
  tmStart:function(d){
    var s=sess(),f=findNode(d.ex);if(!s||!f||s.status!=='open')return;
    var n=f.node,now=Date.now(),lead=prefs.lead*1000;
    ensureAudio();
    ui.timer={ex:n.id,sid:s.id,goal:goalFor(n),phase:lead?'lead':'run',leadEnd:now+lead,startAt:now,acc:0,fired:false,lastLeft:null};
    tmStartTick();syncWake();render();
  },
  tmPause:function(){var t=ui.timer;if(!t||t.phase!=='run')return;t.acc=tmElapsed(t);t.phase='pause';render();},
  tmResume:function(){var t=ui.timer;if(!t||t.phase!=='pause')return;t.phase='run';t.startAt=Date.now();render();},
  tmStop:function(){
    var t=ui.timer;if(!t)return;
    var s=state.sessions[t.sid],sec=Math.floor(tmElapsed(t)/1000),ex=t.ex;
    tmEnd();
    if(s&&s.status==='open'&&t.phase!=='lead'&&sec>=1){
      var h={t:sec};
      putSets(s,ex,setsOf(s,ex).concat([h]));
      save();toast('Held '+fmtDur(sec));
    }
    render();
  },
  tmDiscard:function(){tmEnd();render();},
  tmGoal:function(d){
    var f=findNode(d.ex);if(!f)return;
    var x=ui.tmx[d.ex]=ui.tmx[d.ex]||{};
    x.goal=Math.max(0,Math.min(3599,goalFor(f.node)+(+d.d)));render();
  },
  setAdd:function(d){
    var s=sess(),f=findNode(d.ex);if(!s||!f)return;
    var cur=setsOf(s,d.ex);
    if(cur.length){   // later sets: repeat the previous one straight away
      var src=cur[cur.length-1],x={};
      ['r','w','t'].forEach(function(k){if(src[k]!=null)x[k]=src[k];});
      putSets(s,d.ex,cur.concat([x]));save();render();return;
    }
    // first set: open the editor, prefilled from the last workout's first set if there is one
    var p=lastSets(d.ex,s.ord)[0]||{};
    ui.sheet={type:'set',ex:d.ex,i:-1,timed:!!f.node.timed||p.t!=null,r:p.r!=null?String(p.r):'',w:p.w!=null?fmtWt(p.w):'',t:p.t!=null?fmtDur(p.t):''};render();
  },
  setEdit:function(d){
    var s=sess(),f=findNode(d.ex);if(!s||!f)return;
    var x=setsOf(s,d.ex)[+d.i];if(!x)return;
    ui.sheet={type:'set',ex:d.ex,i:+d.i,timed:x.t!=null||!!f.node.timed,r:x.r!=null?String(x.r):'',w:x.w!=null?fmtWt(x.w):'',t:x.t!=null?fmtDur(x.t):''};render();
  },
  setStep:function(d){
    var sh=ui.sheet;if(!sh||sh.type!=='set')return;
    var dl=+d.d;
    if(d.f==='r')sh.r=String(Math.max(0,Math.min(999,(parseInt(sh.r,10)||0)+dl)));
    else if(d.f==='w')sh.w=fmtWt(Math.max(0,Math.min(2000,(parseFloat(sh.w)||0)+dl)));
    else if(d.f==='t')sh.t=fmtDur(Math.min(5999,Math.max(0,parseDur(sh.t)+dl)));
    render();
  },
  setSave:function(){
    var s=sess(),sh=ui.sheet;if(!s||!sh||sh.type!=='set')return;
    var arr=setsOf(s,sh.ex).slice(),x={};
    if(sh.i>=0&&arr[sh.i]){x=Object.assign({},arr[sh.i]);delete x.r;delete x.w;delete x.t;}
    if(sh.timed){
      var t=parseDur(sh.t);
      if(t<1){toast('Enter a time.');return;}
      x.t=t;
    }else{
      var r=parseInt(sh.r,10),w=parseFloat(sh.w);
      if(!(r>=1)){toast('Enter the reps.');return;}
      x.r=r;
      if(w>0)x.w=Math.round(w*10)/10;
    }
    if(sh.i>=0&&sh.i<arr.length)arr[sh.i]=x;else arr.push(x);
    putSets(s,sh.ex,arr);ui.sheet=null;save();render();
  },
  setDel:function(){
    var s=sess(),sh=ui.sheet;if(!s||!sh||sh.type!=='set')return;
    var arr=setsOf(s,sh.ex).slice();
    if(sh.i>=0&&sh.i<arr.length)arr.splice(sh.i,1);
    putSets(s,sh.ex,arr);ui.sheet=null;save();render();
  },
  addTimer:function(d){var f=findNode(d.node);if(!f)return;f.node.timed=true;save();render();},
  rmTimer:function(d){var f=findNode(d.node);if(!f)return;f.node.timed=false;delete f.node.goal;save();render();},
  prefSound:function(d){prefs.sound=d.v==='1';savePrefs();render();},
  prefWake:function(d){prefs.wake=d.v==='1';savePrefs();syncWake();render();},
  testSound:function(){if(!prefs.sound){toast('Sound is off.');return;}ensureAudio();beep('goal');},
  tab:function(d){if(d.tab==='groups'&&ui.tab==='groups'&&!ui.editGroup)ui.viewGroup=null;ui.tab=d.tab;ui.sheet=null;render();},
  dateShift:function(d){ui.date=addDays(ui.date,+d.n);render();},
  dateToday:function(){ui.date=today();render();},
  pickDay:function(d){ui.date=d.date;render();},
  calDay:function(d){ui.tab='today';ui.date=d.date;ui.open=null;render();},
  toggleFilter:function(d){ui.filter[d.id]=!ui.filter[d.id];render();},
  calMore:function(){ui.weeks+=4;render();},

  startWorkout:function(d){
    if(d.date>today())return;
    ui.sheet={type:'add',isNew:true,date:d.date,sel:[]};render();
  },
  startConfirm:function(){
    var sh=ui.sheet;if(!sh||!sh.isNew||!sh.sel.length)return;
    var s=newSession(sh.date);
    sh.sel.forEach(function(id){if(getGroup(id))s.groupIds.push(id);});
    refresh(s);save();ui.sheet=null;ui.open=s.id;render();
  },
  openSess:function(d){ui.open=d.key;render();},
  openFromHistory:function(d){var s=state.sessions[d.key];if(!s)return;ui.tab='today';ui.date=s.date;ui.open=d.key;render();},
  back:function(){ui.open=null;render();},
  histMode:function(d){ui.histMode=d.m;render();},
  exHist:function(d){var s=sess();if(!s)return;ui.sheet={type:'hist',ex:d.ex,before:s.ord};render();},
  toggleProg:function(d){ui.prog[d.ex]=!ui.prog[d.ex];render();},
  closeSheet:function(){ui.sheet=null;render();},
  closeSheetBg:function(d,t,e){if(e.target===t){ui.sheet=null;render();}},

  addGroupSheet:function(){ui.sheet={type:'add'};render();},
  addGroupPick:function(d){
    if(ui.sheet&&ui.sheet.isNew){
      var sel=ui.sheet.sel,i=sel.indexOf(d.id);
      if(i>=0)sel.splice(i,1);else if(getGroup(d.id))sel.push(d.id);
      render();return;
    }
    var s=sess();if(!s||!getGroup(d.id))return;
    if(s.groupIds.indexOf(d.id)>=0){removeGroup(s,d.id);return;}
    s.groupIds.push(d.id);refresh(s);save();render();
  },
  grpRemove:function(d){var s=sess();if(s)removeGroup(s,d.node);},
  grpMenu:function(d){ui.sheet={type:'grpMenu',node:d.node};render();},
  grpRemoveConfirm:function(){var s=sess(),sh=ui.sheet;if(!s||!sh)return;ui.sheet=null;removeGroup(s,sh.node);render();},
  setSt:function(d){
    var s=sess();if(!s)return;
    var cur=(s.logs[d.ex]||{}).status;
    setLog(s,d.ex,{status:cur===d.st?null:d.st});save();render();
  },
  markAll:function(){var s=sess();if(!s)return;markAllLeaves(s);save();render();},
  finish:function(){
    var s=sess();if(!s)return;
    if(!s.groupIds.length){toast('Add a group first, or discard this workout.');return;}
    refresh(s);   // last sync with the library; from here on this workout is read from its own copy
    if(ui.timer&&ui.timer.sid===s.id)tmEnd();s.status='done';s.doneAt=Date.now();save();ui.open=null;render();toast('Workout saved');
  },
  discard:function(){
    var s=sess();if(!s)return;
    if((s.groupIds.length||Object.keys(s.logs).length)&&!confirm('Discard this workout and everything you logged in it?'))return;
    if(ui.timer&&ui.timer.sid===s.id)tmEnd();delete state.sessions[s.id];ui.open=null;save();render();
  },
  swap:function(d){ui.sheet={type:'swap',node:d.node,child:d.child};render();},
  swapPick:function(d){
    var s=sess(),sh=ui.sheet,f=findNode(sh.node);if(!s||!f)return;
    var arr=s.picks[sh.node],pos=arr?arr.indexOf(sh.child):-1;if(pos<0)return;
    var old=f.node.children.find(function(c){return c.id===sh.child;});
    if(old)dropLogsFor(s,old);
    arr[pos]=d.new;refresh(s);save();ui.sheet=null;render();
  },
  swapRemove:function(){
    var s=sess(),sh=ui.sheet,f=findNode(sh.node);if(!s||!f)return;
    var arr=s.picks[sh.node],pos=arr?arr.indexOf(sh.child):-1;if(pos<0)return;
    var old=f.node.children.find(function(c){return c.id===sh.child;});
    if(old)dropLogsFor(s,old);
    arr.splice(pos,1);refresh(s);save();ui.sheet=null;render();
  },
  addAnother:function(d){
    var s=sess(),f=findNode(d.node);if(!s||!f)return;
    var n=f.node,cur=s.picks[n.id]||[],kids=n.children;
    var idx=cur.length?kids.findIndex(function(c){return c.id===cur[cur.length-1];}):-1;
    for(var i=1;i<=kids.length;i++){var c=kids[(idx+i+kids.length)%kids.length];if(cur.indexOf(c.id)<0){cur.push(c.id);break;}}
    s.picks[n.id]=cur;refresh(s);save();render();
  },
  pickKids:function(d){ui.sheet={type:'pick',node:d.node};render();},
  togglePick:function(d){
    var s=sess(),sh=ui.sheet,f=sh&&findNode(sh.node);if(!s||!f)return;
    var n=f.node,cur=(s.picks[n.id]||[]).slice(),i=cur.indexOf(d.child);
    var child=n.children.find(function(c){return c.id===d.child;});if(!child)return;
    if(i>=0){dropLogsFor(s,child);cur.splice(i,1);}
    else cur.push(d.child);
    cur.sort(function(a,b){
      return n.children.findIndex(function(c){return c.id===a;})-n.children.findIndex(function(c){return c.id===b;});
    });
    s.picks[n.id]=cur;refresh(s);save();render();
  },

  newGroup:function(){var g=grp('',[ex('','')]);state.groups.push(g);save();ui.editGroup=g.id;ui.focus=g.id;render();},
  editGroup:function(d){ui.editGroup=d.id;render();},
  closeEdit:function(){ui.editGroup=null;render();},
  viewGroup:function(d){ui.viewGroup=d.id;render();},
  closeView:function(){ui.viewGroup=null;render();},
  gStart:function(d){
    var g=getGroup(d.id);if(!g)return;
    var open=sessionsOn(today()).filter(function(s){return s.status==='open';});
    var s=open.length?open[open.length-1]:newSession(today());
    if(s.groupIds.indexOf(g.id)<0){s.groupIds.push(g.id);refresh(s);save();}
    ui.tab='today';ui.date=today();ui.open=s.id;ui.sheet=null;render();
  },
  gExHist:function(d){ui.sheet={type:'hist',ex:d.ex,before:Infinity,g:true};render();},
  delGroup:function(){
    var g=getGroup(ui.editGroup);if(!g)return;
    if(!confirm('Delete "'+(g.name||'Untitled')+'"? Finished workouts stay exactly as you did them.'))return;
    state.groups=state.groups.filter(function(x){return x.id!==g.id;});
    ui.editGroup=null;ui.viewGroup=null;save();render();
  },
  loadSample:function(){
    if(state.groups.length&&!confirm('Add the example groups to your library?'))return;
    state.groups=state.groups.concat(sample().groups);save();render();toast('Example groups added');
  },
  mode:function(d){var f=findNode(d.node);if(!f)return;f.node.mode=d.mode;save();render();},
  addEx:function(d){var f=findNode(d.node);if(!f)return;var e=ex('','');f.node.children.push(e);save();ui.focus=e.id;render();},
  addProg:function(d){ui.progOpen[d.node]=true;ui.focusProg=d.node;render();},
  addGrp:function(d){var f=findNode(d.node);if(!f)return;var g=grp('',[ex('','')],{mode:'cycle'});f.node.children.push(g);save();ui.focus=g.id;render();},
  mv:function(d){
    var f=findNode(d.node);if(!f||!f.parent)return;
    var a=f.parent.children,i=a.indexOf(f.node),j=i+(+d.dir);
    if(j<0||j>=a.length)return;
    var t=a[i];a[i]=a[j];a[j]=t;save();render();
  },
  rm:function(d){
    var f=findNode(d.node);if(!f||!f.parent)return;
    if(f.node.kind==='group'&&f.node.children.length&&!confirm('Delete this sub-group and everything in it? Finished workouts stay as they were.'))return;
    f.parent.children=f.parent.children.filter(function(c){return c.id!==d.node;});
    save();render();
  },

  export:function(){
    var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='workouts-'+today()+'.json';
    document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
  },
  importClick:function(){document.getElementById('import-file').click();},
  reloadApp:function(){
    flushSave();
    toast('Reloading…');
    var go=function(){
      /* A fresh query string makes this a new URL, so neither the HTTP cache nor a suspended page can serve the old index.html.
         localStorage is per-origin and is not affected by the query string. */
      location.replace(location.pathname+'?v='+Date.now());
    };
    if(syncOn()&&isDirty()&&!syncUI.conflict){
      clearTimeout(syncUI.timer);
      Promise.race([syncNow(true),new Promise(function(r){setTimeout(r,5000);})]).then(go,go);
    }else go();
  },
  syncSave:function(){
    var tok=document.getElementById('sync-token').value.trim();
    var m=document.getElementById('sync-gist').value.trim().match(/[0-9a-f]{20,40}(?![0-9a-f])/i);
    var gist=m?m[0].toLowerCase():'';
    if(!tok&&!sync.token){toast('Paste a GitHub token first.');return;}
    if(tok)sync.token=tok;
    if(gist!==sync.gist){sync.gist=gist;sync.base=0;sync.lastOk=0;syncUI.conflict=null;}
    saveSync();setStatus('idle');render();
    syncNow(true).then(function(){render();});
  },
  syncDisconnect:function(){
    if(!confirm('Disconnect cloud sync on this device? The token and gist ID are removed from this device. The gist and its data stay on GitHub.'))return;
    clearTimeout(syncUI.timer);
    sync={token:'',gist:'',base:0,lastOk:0};saveSync();
    syncUI.conflict=null;syncUI.status='idle';syncUI.msg='';render();setStatus('idle');
  },
  openConflict:function(){if(syncUI.conflict){ui.sheet={type:'conflict'};render();}},
  useCloud:function(){
    var r=syncUI.conflict;if(!r)return;
    ui.sheet=null;applyRemote(r);setStatus('ok');toast('Loaded the cloud version');
  },
  useDevice:function(){
    ui.sheet=null;syncUI.conflict=null;
    state.updatedAt=Date.now();persistNow();syncUI.force=true;
    render();syncNow(true).then(function(){render();});
  },
  resetAll:function(){
    if(!confirm('Erase all groups and history? This cannot be undone.'+(syncOn()?' Cloud sync is on, so the cloud copy will be replaced with the empty data too (the gist keeps its earlier revisions).':'')))return;
    state=blank();save();flushSave();ui.open=null;ui.editGroup=null;ui.viewGroup=null;render();toast('Erased');
  }
};

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var h=ACTIONS[t.dataset.act];if(h)h(t.dataset,t,e);
});
/* Return on a "Done" input dismisses the keyboard. */
document.addEventListener('keydown',function(e){
  var t=e.target;
  if(e.key==='Enter'&&t&&t.tagName==='INPUT'&&t.getAttribute('enterkeyhint')==='done')t.blur();
});
document.addEventListener('input',function(e){
  var t=e.target,k=t.dataset&&t.dataset.in;if(!k)return;
  if(k==='name'||k==='target'||k==='form'||k==='abbr'||k==='prog'){
    var f=findNode(t.dataset.node);
    if(f){
      f.node[k]=(k==='abbr'?t.value.slice(0,3):t.value);
      if((k==='name'||k==='abbr')&&!f.parent)propagateName(f.node,k);
      save();
    }
  }else if(k==='lognote'){
    var s=sess();if(s){setLog(s,t.dataset.ex,{note:t.value});save();}
  }else if(k==='snote'){
    var s2=sess();if(s2){s2.note=t.value;save();}
  }else if(k==='setf'){
    var sh=ui.sheet;if(sh&&sh.type==='set')sh[t.dataset.f]=t.value;
  }
});
document.addEventListener('change',function(e){
  var t=e.target,k=t.dataset&&t.dataset.ch;if(!k)return;
  if(k==='import'){
    var file=t.files&&t.files[0];if(!file)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var s=JSON.parse(r.result);
        if(!validState(s))throw new Error('bad');
        if(!confirm('Replace your current groups and history with this backup?'))return;
        state=normalize(s);save();flushSave();ui.open=null;ui.editGroup=null;ui.viewGroup=null;render();toast('Backup imported');
      }catch(err){toast('That file is not a valid backup.');}
      t.value='';
    };
    r.readAsText(file);return;
  }
  if(k==='prefLead'){var pv=parseInt(t.value,10);prefs.lead=isNaN(pv)?5:Math.max(0,Math.min(30,pv));savePrefs();render();return;}
  var f=findNode(t.dataset.node);if(!f)return;
  var n=f.node;
  if(k==='goal'){
    n.goal=parseDur(t.value);
  }else if(k==='pick'){
    n.pick=Math.max(1,parseInt(t.value,10)||1);
    if(n.pickMax&&n.pickMax<=n.pick)n.pickMax=null;
  }else if(k==='pickMax'){
    var v=parseInt(t.value,10);n.pickMax=(v&&v>(n.pick||1))?v:null;
  }
  save();render();
});
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='hidden'){
    flushSave();
    if(syncOn()&&isDirty()&&!syncUI.conflict){clearTimeout(syncUI.timer);syncNow(false);}   // try to push before iOS suspends the app
  }
  if(document.visibilityState==='visible'){
    wlTry=0;syncWake();
    if(ui.lastToday!==today()){
      if(ui.date===ui.lastToday)ui.date=today();
      ui.lastToday=today();render();
    }
    syncNow(false);   // pull anything another device saved
  }
});

window.__WT={flushSave:flushSave,get state(){return state;},set state(v){state=v;},ui:ui,ACTIONS:ACTIONS,render:render,sample:sample,get sync(){return sync;},syncNow:syncNow};
render();
setStatus('idle');
syncNow(false);
})();
</script>
