<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workouts">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f2f3f4">
<title>Workout Tracker</title>
<style>
:root{
  --bg:#f2f3f4; --border:#cdd2d5; --card:#fbfbfb; --text:#1e2327; --muted:#687176; --line:#d6dadc;
  --lead:#2f6f9f; --lead-bg:#eef4f9; --lead-bd:#b3cfe3; --run-bg:#fef4ec; --run-bd:#f2c4a0; --hit-bd:#a9d1b9; --hit-bg:#ebf5ee;
  --live-weak:#fde8d6; --live-ink:#a4531a; --live:#d9480f; --live-text:#fff; --accent:#64767f; --accent-weak:#e2e6e8; --accent-text:#ffffff; --link:#4d6b73;
  --ok:#3f7a56; --ok-weak:#dcebe1; --part:#9a661a; --part-weak:#f3e6cf;
  --skip:#747c81; --skip-weak:#e3e6e7; --bad:#b4443c;
  --head-bg:#f0f2f3; --head-bd:#dde1e3; --head-ink:#6a7478;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121415; --border:#3c4347; --card:#1a1d1f; --text:#e6e9ea; --muted:#8a9398; --line:#2a2f32;
    --lead:#7fb2d9; --lead-bg:#19232b; --lead-bd:#35566e; --run-bg:#2a2019; --run-bd:#74502c; --hit-bd:#376548; --hit-bg:#15211a;
    --live-weak:#3a2a1b; --live-ink:#ffb97a; --live:#ff9f4a; --live-text:#121415; --accent:#cfd6da; --accent-weak:#262c30; --accent-text:#121415; --link:#9fbcc4;
    --ok:#6fbf8b; --ok-weak:#17281e; --part:#dfaa5f; --part-weak:#30260f;
    --skip:#98a1a6; --skip-weak:#23282b; --bad:#ee8279;
    --head-bg:#22272a; --head-bd:#353c40; --head-ink:#a3acb1;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-variant-numeric:tabular-nums}
#app{max-width:680px;margin:0 auto;padding:14px 14px calc(92px + env(safe-area-inset-bottom))}
h1{font-size:28px;line-height:1.1;margin:6px 0 14px;font-weight:800;letter-spacing:-.02em}
h2{font-size:17px;margin:0 0 8px;font-weight:700}
h3{font-size:19px;margin:0;font-weight:800;letter-spacing:-.01em}
p{margin:0 0 8px}
.muted{color:var(--muted)} .small{font-size:13px}
.between{justify-content:space-between}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input:focus-visible,textarea:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin:0 0 12px}
.btn{min-height:44px;padding:0 16px;border-radius:8px;background:var(--accent);color:var(--accent-text);font-weight:700}
.btn.sec{background:var(--accent-weak);color:var(--text)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:600}
.btn.danger{background:transparent;border:1px solid var(--line);color:var(--bad);font-weight:600}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.backb{display:inline-flex;align-items:center;gap:2px;padding-left:6px}
.btn.icon{width:42px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;margin:6px 0 14px}
.head h1{margin:0}
.head .btn.ghost:not(.sm){min-height:38px}
.btn.block{width:100%}
.btn.full{flex:1 1 100%}
.inp{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit;font-size:16px}
textarea.inp{min-height:76px;resize:vertical}
textarea.inp.sm{min-height:64px;line-height:1.35}
.inp.num{width:64px;text-align:center;padding:8px 4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{min-height:38px;padding:0 13px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-text)}
.seg button:active:not(.on){background:var(--accent-weak)}
.btn:active{filter:brightness(.92)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--accent-weak);color:var(--text)}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--skip-weak);color:var(--skip)}
.badge.fr{float:right;margin:0 0 4px 8px}
.badge.done{background:var(--ok-weak);color:var(--ok)}
.badge.open{background:var(--live-weak);color:var(--live-ink)}
.tag.nxt{background:#d6e8f7;color:#1d4f78}
@media (prefers-color-scheme:dark){.tag.nxt{background:#1f3a50;color:#a9d3f2}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:3px 10px;border-radius:99px;background:var(--accent-weak)}
.chip b{font-weight:800}
.caption{font-size:13px;color:var(--muted);margin:8px 0 0}

/* week strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:0 0 12px}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:8px;border:1px solid transparent;color:var(--muted)}
.day .dn{font-size:12px;font-weight:600}
.day .dd{font-size:18px;font-weight:800;color:var(--text)}
.day.today .dd{color:var(--link)}
.day.on{background:var(--card);border-color:var(--line)}
.dots{display:flex;gap:3px;height:8px}
.dot{width:8px;height:8px;border-radius:50%;border:2px solid var(--skip);background:transparent}
.dot.done{background:var(--ok);border-color:var(--ok)}
.dot.open{background:var(--accent);border-color:var(--accent)}

/* cards */
.slot-h{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.slot-h b{font-size:17px}
.hdate{float:right;margin:2px 0 0 10px;font-size:13px;font-weight:500;color:var(--muted)}
.lines{margin:6px 0 10px;padding:0;list-style:none;font-size:14px;color:var(--muted)}
.lines li{padding:2px 0}
.lines b{color:var(--text);font-weight:400}
.gtl{font-weight:700;margin:12px 0 0}
button>.gtl:first-child,.badge.fr+.gtl,.slot-h+.gtl,.hdate+.gtl{margin-top:0}
.lines li.sk{text-decoration:line-through;opacity:.6}
.lines .nt{color:var(--muted);font-weight:400}
.mk{display:inline-block;width:1.3em;color:var(--ok);font-weight:700}
.mk.partial{color:var(--part)}
.mk.skipped{color:var(--skip)}

/* session */
.gsec{margin:0 0 22px}
/* Groups list: one line per option of a rotating sub-group. */
.gsub{display:grid;grid-template-columns:auto 1fr;gap:3px 5px;margin:3px 0 0 2px}
.gsub-n{color:var(--muted);font-weight:600}
.gsec.nested{margin:0}
.gsec.gtop>.gh{margin:0 2px 8px}
.gsec.gtop>.btn.sm{margin-top:0}
.gsec.gcard{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:0;margin:0 0 12px;overflow:hidden}
.gsec.gcard>.subhead{margin:0;padding:6px 8px 6px 12px;background:var(--head-bg);border-bottom:1px solid var(--head-bd);color:var(--head-ink);font-weight:600}
.gsec.gcard>.subhead .link{color:inherit}
.gcard .gbody{padding:0 12px 12px}
.gcard .gbody>:first-child{margin-top:12px}
.gsec.nested .ex{background:none;border:0;border-radius:0;padding:0;margin:14px 0 0}
.gsec.nested .ex+.ex{border-top:1px solid var(--line);padding-top:14px}
.gsec.nested .subhead+.ex{margin-top:8px}
.gcard .gbody>.gsec.nested:first-child>.subhead{margin-top:0}
/* Siblings inside a sub-group card (a nested sub-group next to an exercise or another sub-group) get the same divider as two exercises. */
.gcard .gbody>.gsec.nested+.ex,.gcard .gbody>.ex+.gsec.nested,.gcard .gbody>.gsec.nested+.gsec.nested{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}
.gcard .gbody>*+.gsec.nested>.subhead{margin-top:0}
/* A sub-group label inside a card matches the small label on a single-exercise sub-group. */
.gcard .gbody .gsec.nested>.subhead{font-size:12px}
.gcard .gbody .gsec.nested>.subhead+.ex{margin-top:0}
.swapb{font-size:18px;line-height:1;padding:6px 8px;color:var(--muted)}
.gmenu{font-size:18px;letter-spacing:1px;padding:6px 10px}
.ex-eyebrow{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.gcount{font-weight:400;font-size:13px;color:var(--muted);margin-left:8px}
.gh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0}
.gh h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.subhead{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:22px 0 0}
.cap{font-size:13px;color:var(--muted);margin:-4px 0 8px}
.ex{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin:0 0 12px}
.ex.s-skipped{opacity:.75}
.ex-name{font-weight:700;font-size:17px}
.ex-guide{font-size:14px;color:var(--muted)}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 8px}
.st button{min-height:42px;border-radius:8px;border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--muted)}
.st button.on[data-st="done"]{background:var(--ok);border-color:var(--ok);color:var(--accent-text)}
.st button.on[data-st="partial"]{background:var(--part);border-color:var(--part);color:var(--accent-text)}
.st button.on[data-st="skipped"]{background:var(--skip);border-color:var(--skip);color:var(--accent-text)}
.link{color:var(--link);font-weight:700;font-size:13px;padding:6px 4px}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:2px 0 14px}
.progress i{display:block;height:100%;background:var(--ok)}
.trend{margin-top:6px;font-size:13px;color:var(--muted)}
.trend b{font-weight:600}
.trend .tl{display:flex;align-items:center;gap:8px}
.trend .tg{flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.progn{margin-top:6px;font-size:13px;color:var(--muted)}
.progn button{text-align:left;padding:2px 0}
.progn u{text-decoration:none;color:var(--link);font-weight:700}
.progn p{margin:4px 0 0 2px;padding-left:10px;border-left:2px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}
.hchart{margin:12px 0 4px}
.hchart .cap{font-size:13px;color:var(--muted);margin:6px 0 2px}
.hchart svg{display:block;width:100%;max-width:440px;height:auto;overflow:visible}
.hl{list-style:none;margin:8px 0 14px;padding:0}
.hl li{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.hl time{flex:none;width:64px;color:var(--muted)}
.hl span{min-width:0;overflow-wrap:anywhere}

/* group view (read-only) */
.vstats{font-size:14px;color:var(--muted);margin:0 0 4px}
.vg-b{margin-top:8px}
.vg-rot+.vx{margin-top:8px}
.vx+.vx{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.vx-last{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:13px;color:var(--muted)}
.vx-last .tg{flex:1;min-width:0;overflow-wrap:anywhere}
.vx-last b{font-weight:600;color:var(--muted)}
.spark{flex:none}
.vsub{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.nx{margin:8px 0 0;padding-left:20px}
.nx li{margin:3px 0}

/* calendar grid */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;align-items:stretch;background:var(--line);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.cal .hd{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:5px 0;background:var(--card)}
.cal-c{position:relative;display:flex;align-items:center;justify-content:center;min-height:58px;padding:13px 1px 12px;border-radius:0;background:var(--card);border:0}
.cal-c .cn{position:absolute;top:2px;left:4px;font-size:9px;color:var(--muted)}
.cal-c .cc{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}
.cal-c.today{box-shadow:inset 0 0 0 2px var(--text)}
.cal-c.future{background:var(--bg)}
.cg{font-style:normal;font-size:11px;font-weight:800;line-height:1;padding:2px 3px;border-radius:4px;background:var(--ok-weak);color:var(--ok)}
.cg.open{background:var(--part-weak);color:var(--part)}
.cd{position:absolute;bottom:3px;right:4px;width:7px;height:7px;border-radius:50%;border:1.5px solid var(--skip)}
.cd.done{background:var(--ok);border-color:var(--ok)}
.cd.open{border-color:var(--part)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin:10px 0 16px;font-size:12px;color:var(--muted)}
.legend b{color:var(--text)}
.legend{gap:8px}
.lchip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:18px;font-size:13px;color:var(--muted)}
.lchip.on{background:var(--accent-weak);border-color:var(--accent);color:var(--text)}

/* hold timer */
.tmr{margin:12px 0 4px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.tmr.run,.tmr.pause{border-color:var(--run-bd);background:var(--run-bg)}
.tmr.lead{border-color:var(--lead-bd);background:var(--lead-bg)}
.tmr.hit{border-color:var(--hit-bd);background:var(--hit-bg)}
.tmr.pause .tm-digits{opacity:.6}
.tm-top{margin:0 0 8px}
.tm-goal{min-width:56px;text-align:center;font-weight:700;font-size:15px}
.tm-digits{text-align:center;font-size:60px;line-height:1.05;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
.tmr.hit .tm-digits{color:var(--ok)}
.tmr.lead .tm-digits{color:var(--lead)}
.tm-sub{text-align:center;font-size:14px;color:var(--muted);margin:0 0 10px}
.tm-btns>.btn{flex:1 1 0;min-width:0}
.tmh{margin-top:10px;align-items:center}
.tm-goalctl,.tm-trash,.tm-trash-ph{flex:none;margin-left:auto}
.tm-trash.btn.sm.icon{min-height:32px;height:32px;width:36px}
.tm-trash-ph{height:32px;width:36px}
.tm-goalctl{gap:4px}
.hc{min-height:32px}
.hc.add{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.stp{display:flex;gap:8px;align-items:center}
.stp .btn{width:52px;flex:none;padding:0;font-size:20px}
.stp .inp{flex:1;min-width:0;text-align:center}
@media (prefers-reduced-motion:no-preference){.tmr.flash{animation:tmflash .5s ease-out 2}}
@keyframes tmflash{50%{filter:brightness(1.12)}}

/* editor */
.enode{margin:10px 0 0}
.enode.grp.child{padding:10px 0 4px 10px;border-left:3px solid var(--accent-weak)}
.enode.ex-n{padding:10px;border:1px solid var(--line);border-radius:8px}
.ctl{display:flex;gap:2px;flex:none}
.ctl button{width:36px;height:36px;border-radius:8px;color:var(--muted);font-size:17px}
.ctl button:active{background:var(--accent-weak)}
.hint{font-size:13px;color:var(--muted);margin:6px 0 2px}
.sub{margin-top:8px}

.lbl{width:104px;flex:none}
.erow{padding:14px 0}
.erow:first-child{padding-top:0}.erow:last-child{padding-bottom:0}
.erow+.erow{border-top:1px solid var(--line)}
.inp.sm{min-height:40px;font-size:16px;padding:6px 10px}
.inp.num.sm{padding:6px 4px;width:64px}
.nest{margin:12px 0 0;padding:4px 0 0 12px;border-left:3px solid var(--accent-weak)}
/* tabs, sheet, toast */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;min-height:58px;font-size:13px;font-weight:600;color:var(--muted);position:relative}
#tabs button.on{color:var(--text)}
#tabs button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
.backdrop{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:680px;max-height:82vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;min-height:52px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;margin:0 0 8px}
.opt.on{border-color:var(--accent);background:var(--accent-weak)}
.opt small{display:block;color:var(--muted);font-size:13px}
.opt span{min-width:0}
.opt small.pv{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;max-width:90vw}
#tabs button.bad::after{content:"";position:absolute;top:12px;left:calc(50% + 16px);width:8px;height:8px;border-radius:50%;background:var(--bad)}
.sync-line{font-size:14px;margin:0 0 10px}
.sync-line.ok{color:var(--ok)} .sync-line.err{color:var(--bad)}
.fld{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 4px}
.steps{margin:6px 0 0;padding-left:20px;font-size:14px;color:var(--muted)}
.steps li{margin:3px 0}
.empty{padding:18px;text-align:center;color:var(--muted)}
.empty-day{padding:28px 18px;display:flex;flex-direction:column;align-items:center;gap:6px}
.empty-day svg{opacity:.55;margin-bottom:4px}
.empty-day b{color:var(--muted);font-size:14px;font-weight:400}
.sess-line{font-size:14px;margin:2px 0}
.sess-line .m{color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.backdrop:not(.still){animation:fade .15s ease-out}.backdrop:not(.still) .sheet{animation:up .18s ease-out}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
</style>
</head>
<body>
<div id="app"></div>
<nav id="tabs" aria-label="Sections">
  <button data-act="tab" data-tab="today">Workout</button>
  <button data-act="tab" data-tab="groups">Groups</button>
  <button data-act="tab" data-tab="history">History</button>
  <button data-act="tab" data-tab="settings">Settings</button>
</nav>
<div id="sheet-root"></div>
<div id="toast-root"></div>
<input type="file" id="import-file" accept="application/json,.json" hidden data-ch="import">

<script>
(function(){
'use strict';

/* ───────── constants & helpers ───────── */
var STORE_KEY='workout-tracker-v3';
var DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var storageOk=true;

function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return String(n).padStart(2,'0');}
function toISO(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fromISO(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function dow(iso){return fromISO(iso).getDay();}                    // Sun=0 … Sat=6
function addDays(iso,n){var d=fromISO(iso);d.setDate(d.getDate()+n);return toISO(d);}
function today(){return toISO(new Date());}
function weekStart(iso){return addDays(iso,-dow(iso));}
function dparts(iso){
  var o={};
  new Intl.DateTimeFormat(undefined,{weekday:'short',month:'short',day:'numeric'}).formatToParts(fromISO(iso)).forEach(function(p){o[p.type]=p.value;});
  return o;
}

/* ───────── model ─────────

   }

   A group holds exercises and sub-groups. An exercise has a name, an optional target (sets/reps/time) and an optional form cue.
   A session is one workout on one date. You add groups to it by hand. `manual` sessions are

var saveTimer=null;

function getGroup(id){return state.groups.find(function(g){return g.id===id;})||null;}

    for(var i=0;i<kids.length;i++){var r=walk(kids[i],n);if(r)return r;}
    return null;
  }

/* ───────── rotation engine ─────────
   A group is "all" (every child, every workout) or "cycle" (pick N children per workout, continuing
   from the last child picked in the most recent *finished* workout, by date, then wrapping). Backfilled (manual)
   workouts count too; open workouts never move a cycle. */
function cursorOf(node,before){
  var n=node.children.length;if(!n)return 0;
  var done=Object.keys(state.sessions).map(function(k){return state.sessions[k];}).filter(function(s){
    return s.status==='done'&&s.ord<before&&s.picks&&s.picks[node.id]&&s.picks[node.id].length;
  }).sort(function(a,b){return b.ord-a.ord;});
  for(var i=0;i<done.length;i++){
    var p=done[i].picks[node.id];var last=p[p.length-1];

    if(!cur.length&&!manual)cur=pickIds(node,cf(node),node.pick||1);
    picks[node.id]=cur;reach[node.id]=1;
    cur.forEach(function(id){fill(kids.find(function(c){return c.id===id;}),picks,reach,cf,manual);});
  }else{

/* ───────── sessions ───────── */
function sessList(){return Object.keys(state.sessions).map(function(k){return state.sessions[k];});}
function sessionsOn(date){return sessList().filter(function(s){return s.date===date;}).sort(byOrd);}
function nextOrd(date){
  var base=fromISO(date).getTime(),mx=base-1000;
  sessList().forEach(function(s){if(s.date===date&&s.ord>mx)mx=s.ord;});

/* Every workout keeps its own copy of the groups it used (s.tree[groupId]): only the exercises that were actually in it,
   with the names, targets and form cues they had. An open workout follows the library and refreshes that copy; a finished
   one never reads the library again, so deleting, moving or adding things later cannot change it. The one exception is
   renaming a top-level group (see propagateName). Cycle groups are stored flattened to "do all" of what was picked. */
function freezeNode(n,picks){
  if(n.kind==='exercise')return {id:n.id,kind:'exercise',name:n.name||'',target:n.target||'',form:n.form||''};
  return {id:n.id,kind:'group',name:n.name||'',abbr:n.abbr||'',mode:'all',pick:1,pickMax:null,
    children:pickedKids(n,picks).map(function(c){return freezeNode(c,picks);})};
}
/* The group a workout should show for id: the live one while the workout is open, otherwise its own copy. */
function groupFor(s,id){
  var live=getGroup(id);

  return (s.tree&&s.tree[id])||live||null;
}
function treeFind(s,id){
  function walk(n){
    if(n.id===id)return n;
    var k=n.children||[];
    for(var i=0;i<k.length;i++){var r=walk(k[i]);if(r)return r;}
    return null;
  }
  var roots=Object.keys(s.tree||{});
  for(var i=0;i<roots.length;i++){var r=walk(s.tree[roots[i]]);if(r)return r;}
  return null;
}
function nameOf(s,id){

}
function refresh(s){
  s.snap=s.snap||{};s.tree=s.tree||{};

    /* Finished: groups already in the workout keep their copy; only a group added now is resolved and copied. */
    var fresh=s.groupIds.filter(function(id){return !s.tree[id]&&getGroup(id);});
    if(fresh.length){
      var p=resolvePicks(fresh,{},s.ord,s.manual);
      Object.keys(p).forEach(function(k){s.picks[k]=p[k];});
      fresh.forEach(function(id){s.tree[id]=freezeNode(getGroup(id),s.picks);});
    }
  }else{
    s.picks=resolvePicks(s.groupIds,s.picks,s.ord,s.manual);
    /* A group deleted from the library while this workout is open keeps its last copy, and anything logged in it. */
    s.groupIds.forEach(function(id){var g=getGroup(id);if(g)s.tree[id]=freezeNode(g,s.picks);});

   exercises and sub-groups keep the names, targets and form cues they had when the workout happened. */
function propagateName(g,key){
  Object.keys(state.sessions).forEach(function(sid){

function newSession(date){

  state.sessions[s.id]=s;refresh(s);save();return s;

function labelFor(s){

var STATUS_LABEL={open:'In progress',done:'Done'};

function history(exId,before,limit){

    return s.ord<before&&s.logs&&s.logs[exId]&&trendText(s.logs[exId]);

/* ───────── cloud sync (private GitHub gist) ─────────
   localStorage stays the working copy. A private gist holds one file, workouts.json, as {savedAt, state}.
   sync.base is the state.updatedAt value both sides agreed on at the last successful sync:
     only this device changed → push · only the cloud changed → pull · both changed → ask which to keep.
   The token and gist id live in their own localStorage key, never inside state, so exports and the gist never contain the token. */
var SYNC_KEY='workout-tracker-sync-v1';
var BACKUP_KEY='workout-tracker-before-sync';
var GIST_FILE='workouts.json';
var sync=loadSync();
var syncUI={status:'idle',msg:'',busy:false,again:false,conflict:null,timer:null};
function loadSync(){
  try{
    var o=JSON.parse(localStorage.getItem(SYNC_KEY)||'null');
    if(o&&typeof o==='object')return {token:String(o.token||''),gist:String(o.gist||''),base:+o.base||0,lastOk:+o.lastOk||0};
  }catch(e){}

}
function saveSync(){try{localStorage.setItem(SYNC_KEY,JSON.stringify(sync));}catch(e){}}
function syncOn(){return !!sync.token;}

function gh(method,path,body){

  if(body){opt.body=JSON.stringify(body);opt.headers['Content-Type']='application/json';}
  return fetch('https://api.github.com'+path,opt).then(function(r){
    if(r.ok)return r.json();
    var e=new Error('http');e.status=r.status;
    return r.json().catch(function(){return {};}).then(function(j){e.detail=j&&j.message||'';e.rate=r.headers.get('x-ratelimit-remaining')==='0';throw e;});
  });
}
function errText(e){

  if(e&&e.status===403)return e.rate?'GitHub rate limit reached. Try again in a while.':'The token is not allowed to do this. It needs the "Gists: Read and write" permission.';
  if(e&&e.status===404)return 'Gist not found. Check the gist ID, and that the token belongs to the same GitHub account.';
  if(e&&e.status)return 'GitHub error '+e.status+(e.detail?': '+e.detail:'')+'.';

}
/* Returns {savedAt,state} from the gist, or null when the gist has no workouts file yet. */
function readRemote(g){

function payload(stamp){return JSON.stringify({app:'workout-tracker',version:1,savedAt:stamp,state:state});}

function setStatus(st,msg){

function fmtStamp(ms){

}
function syncLine(){
  if(!syncOn())return {cls:'',text:'Cloud sync is off. Data is saved only on this device.'};
  if(syncUI.conflict)return {cls:'err',text:'This device and the cloud both changed. Choose which to keep.'};
  if(syncUI.status==='syncing')return {cls:'',text:'Syncing…'};
  if(syncUI.status==='error')return {cls:'err',text:syncUI.msg};
  if(isDirty())return {cls:'',text:'Changes waiting to sync.'};

function schedulePush(ms){

}
function backupLocal(){
  try{localStorage.setItem(BACKUP_KEY,JSON.stringify({at:Date.now(),state:state}));}catch(e){}
}

  syncUI.conflict=null;

}
function pushLocal(){
  var stamp=state.updatedAt||0,body=payload(stamp);

    ?gh('PATCH','/gists/'+sync.gist,{files:{'workouts.json':{content:body}}})
    :gh('POST','/gists',{description:'Workout Tracker data (private, written by the app)',public:false,files:{'workouts.json':{content:body}}});
  return req.then(function(g){
    if(!sync.gist&&g&&g.id)sync.gist=g.id;
    sync.base=stamp;sync.lastOk=Date.now();saveSync();
    syncUI.conflict=null;
  });

function doSync(){
  if(!sync.gist||syncUI.force){syncUI.force=false;return pushLocal();}
  return gh('GET','/gists/'+sync.gist).then(readRemote).then(function(r){
    var ls=state.updatedAt||0;
    if(!r)return pushLocal();
    if(r.savedAt===ls){sync.base=ls;sync.lastOk=Date.now();saveSync();syncUI.conflict=null;return;}
    var dirty=ls>sync.base,remoteNew=r.savedAt>sync.base;
    if(dirty&&!remoteNew)return pushLocal();
    if(!dirty&&remoteNew)return applyRemote(r);

    syncUI.conflict=r;ui.sheet={type:'conflict'};render();

function syncNow(manual){
  if(!syncOn())return Promise.resolve();

  if(syncUI.conflict&&!manual)return Promise.resolve();
  syncUI.busy=true;setStatus('syncing');
  return doSync().then(function(){setStatus('ok');},function(e){setStatus('error',errText(e));}).then(function(){
    syncUI.busy=false;
    if(syncUI.again){syncUI.again=false;schedulePush(500);}
    else if(syncOn()&&isDirty()&&syncUI.status!=='error'&&!syncUI.conflict)schedulePush(1500);
    setStatus(syncUI.status,syncUI.msg);
  });

window.addEventListener('online',function(){syncNow(false);});

/* ───────── UI state ───────── */
var ui={tab:'today',date:today(),open:null,editGroup:null,viewGroup:null,sheet:null,focus:null,focusProg:null,progOpen:{},prog:{},weeks:5,filter:{},lastToday:today(),viewKey:'',timer:null,tmx:{}};

/* Merge runs of identical sets: 4 × 12 @ 60 lb · 2 × 0:45 */
function setsStr(a){
  /* holds: "3 × 0:45" only when every hold is the same, otherwise each one is listed */
  if(a.length&&a.every(function(x){return x.r==null&&x.t!=null&&x.w==null;})){
    if(a.length>1&&a.every(function(x){return x.t===a[0].t;}))return a.length+' × '+fmtDur(a[0].t);
    return a.map(function(x){return fmtDur(x.t);}).join(' · ');
  }
  var out=[],i=0;
  while(i<a.length){
    var x=a[i],n=1;
    while(i+n<a.length&&a[i+n].r===x.r&&a[i+n].w===x.w&&a[i+n].t===x.t)n++;
    var core=setCore(x),txt=(n>1||(x.r!=null&&x.w!=null))?n+(x.r!=null?'×':' × ')+core:core;
    if(x.w!=null)txt+=' @ '+fmtWt(x.w)+' lbs';
    out.push(txt);i+=n;
  }
  return out.join(' · ');
}
function setsSpan(l){return hasSets(l)?' <span class="nt">'+esc(setsStr(l.sets||l.holds))+'</span>':'';}
function trendText(l){return [setsStr(l.sets||l.holds||[]),String(l.note||'').trim()].filter(Boolean).join(', ');}
function lastSets(exId,before){
  var best=null;
  sessList().forEach(function(s){
    if(s.ord<before&&s.logs&&hasSets(s.logs[exId])&&(!best||s.ord>best.ord))best=s;
  });
  return best?setsOf(best,exId):[];
}
function goalFor(node){var x=ui.tmx[node.id];return (x&&typeof x.goal==='number')?x.goal:(node.goal||0);}
function tmElapsed(t){return t.acc+(t.phase==='run'?Date.now()-t.startAt:0);}

/* sound: the audio context must be created inside a tap (Start), or iOS keeps it silent */
var AC=null;
function ensureAudio(){
  if(!prefs.sound)return;
  try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
  try{
    var C=window.AudioContext||window.webkitAudioContext;
    if(!AC&&C)AC=new C();
    if(AC&&AC.state!=='running')AC.resume();
  }catch(e){}
}
function tone(freq,at,dur,vol){
  var o=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime+at;
  o.type='sine';o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol,t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+dur+0.02);
}
function beep(kind){
  if(!prefs.sound||!AC)return;
  try{
    if(AC.state!=='running')AC.resume();
    if(kind==='tick')tone(880,0,.07,.25);
    else if(kind==='go')tone(1175,0,.18,.35);
    else{tone(1319,0,.16,.4);tone(1319,.24,.16,.4);tone(1760,.48,.32,.4);}
  }catch(e){}
}

/* screen wake lock: held while a workout is open on screen (or a timer is running) */
var wl=null,wlBusy=false,wlTry=0;
function wantWake(){
  if(!prefs.wake||document.visibilityState!=='visible')return false;
  if(ui.timer)return true;
  var s=(ui.tab==='today'&&ui.open)?state.sessions[ui.open]:null;
  return !!(s&&s.status==='open');
}
function syncWake(){
  if(!('wakeLock' in navigator))return;
  if(wantWake()){
    if(wl||wlBusy||Date.now()-wlTry<5000)return;
    wlBusy=true;wlTry=Date.now();
    navigator.wakeLock.request('screen').then(function(l){
      wlBusy=false;wl=l;
      l.addEventListener('release',function(){if(wl===l)wl=null;});
      if(!wantWake()){wl=null;l.release().catch(function(){});}
    },function(){wlBusy=false;});
  }else if(wl){
    var l=wl;wl=null;l.release().catch(function(){});
  }
}

/* ticking: only the digits are repainted, so typing and scrolling are never disturbed */
var tmIv=null;
function tmStartTick(){if(tmIv===null)tmIv=setInterval(tmTick,200);}
function tmEnd(){ui.timer=null;if(tmIv!==null){clearInterval(tmIv);tmIv=null;}syncWake();}
function tmDigits(t){
  if(t.phase==='lead')return String(Math.max(1,Math.ceil((t.leadEnd-Date.now())/1000)));
  return fmtDur(tmElapsed(t)/1000);
}
function tmSub(t){
  if(t.phase==='lead')return 'Get ready';
  var el=Math.floor(tmElapsed(t)/1000),p=t.phase==='pause'?'Paused · ':'';
  if(!t.goal)return p+'No goal';
  return p+(el>=t.goal?'+'+fmtDur(el-t.goal)+' past goal ('+fmtDur(t.goal)+')':'Goal '+fmtDur(t.goal));
}
function tmPaint(){
  var t=ui.timer;if(!t)return;
  var d=document.querySelector('[data-tmtxt="'+t.ex+'"]'),u=document.querySelector('[data-tmsub="'+t.ex+'"]');
  if(d)d.textContent=tmDigits(t);
  if(u)u.textContent=tmSub(t);
}
function tmTick(){
  var t=ui.timer;if(!t){tmEnd();return;}
  var s=state.sessions[t.sid];
  if(!s||s.status!=='open'){tmEnd();render();return;}
  var now=Date.now();
  if(t.phase==='lead'){
    var left=Math.ceil((t.leadEnd-now)/1000);
    if(left<=0){t.phase='run';t.startAt=t.leadEnd;t.acc=0;beep('go');render();return;}
    if(left!==t.lastLeft){t.lastLeft=left;if(left<=3)beep('tick');}
  }else if(t.phase==='run'){
    if(t.goal&&!t.fired&&tmElapsed(t)>=t.goal*1000){
      t.fired=true;beep('goal');
      try{if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}
      var box=document.querySelector('.tmr[data-tm="'+t.ex+'"]');if(box){box.classList.add('hit');box.classList.add('flash');}
    }
  }
  tmPaint();
}

/* the card */
function chipsHTML(node,sets,editable,canAdd,extra){
  if(!sets.length&&!canAdd&&!extra)return '';
  var h='<div class="chips tmh">'+sets.map(function(x,i){
    var txt=setChip(x);
    if(!editable)return '<span class="chip">'+esc(txt)+'</span>';
    return '<button class="chip hc" data-act="setEdit" data-ex="'+node.id+'" data-i="'+i+'" aria-label="Edit set '+(i+1)+': '+esc(txt)+'">'+esc(txt)+'</button>';
  }).join('');
  if(canAdd)h+='<button class="chip hc add" data-act="setAdd" data-ex="'+node.id+'" aria-label="Add a set">+ Set</button>';
  return h+(extra||'')+'</div>';
}
function timerHTML(node,s){
  var sets=setsOf(s,node.id),open=s.status==='open';
  var live=open&&!s.manual&&!!node.timed;
  if(!live)return chipsHTML(node,sets,true,true);
  var t=ui.timer,mine=!!(t&&t.ex===node.id&&t.sid===s.id),id=node.id,out,gc='';
  if(mine){
    out='<div class="tmr '+t.phase+(t.fired?' hit':'')+'" data-tm="'+id+'">'+
      '<div class="tm-digits" data-tmtxt="'+id+'">'+esc(tmDigits(t))+'</div>'+
      '<div class="tm-sub" data-tmsub="'+id+'">'+esc(tmSub(t))+'</div>'+
      '<div class="row tm-btns">'+(
        t.phase==='lead'?'<button class="btn ghost" data-act="tmDiscard">Cancel</button>':
        t.phase==='run'?'<button class="btn sec" data-act="tmPause">Pause</button><button class="btn" data-act="tmStop">Stop</button>':
        '<button class="btn sec" data-act="tmResume">Resume</button><button class="btn" data-act="tmStop">Stop</button>'
      )+'</div>';
    gc='<span class="tm-trash-ph" aria-hidden="true"></span>';
    if(t.phase==='pause')gc='<button class="btn danger sm icon tm-trash" data-act="tmDiscard" aria-label="Discard this hold" title="Discard"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg></button>';
  }else{
    var goal=goalFor(node);
    out='<div class="tmr" data-tm="'+id+'">'+
      '<button class="btn block" data-act="tmStart" data-ex="'+id+'">Start timer</button>';
    gc='<span class="row tm-goalctl"><button class="btn ghost sm icon" data-act="tmGoal" data-ex="'+id+'" data-d="-5" aria-label="Goal 5 seconds shorter">−5</button>'+
      '<span class="tm-goal">'+(goal?fmtDur(goal):'No goal')+'</span>'+
      '<button class="btn ghost sm icon" data-act="tmGoal" data-ex="'+id+'" data-d="5" aria-label="Goal 5 seconds longer">+5</button></span>';
  }
  return out+chipsHTML(node,sets,true,false,gc)+'</div>';
}
/* group editor: switch the timer on, optional goal, optional goal */
function timerField(node){
  var id=' data-node="'+node.id+'"';
  if(!node.timed)return '<div class="sub"><button class="link" style="padding-left:0" data-act="addTimer"'+id+'>+ Add timer</button></div>';

    '<input class="inp num sm" style="width:84px" inputmode="numeric" data-ch="goal"'+id+' value="'+(node.goal?fmtDur(node.goal):'')+'" placeholder="none" aria-label="Goal time, like 0:45">'+
    '<button class="link" data-act="rmTimer"'+id+'>Remove</button></div>';
}

/* ───────── shared bits ───────── */
function badgeHTML(st){return st==='open'?'<span class="badge open">'+esc(STATUS_LABEL.open)+'</span>':'';}
function itemsOf(s){
  var names=[],items=[],sections=[];
  s.groupIds.forEach(function(id){
    names.push(nameOf(s,id));
    var g=groupFor(s,id),its=g?leafItems(g,s.picks,[]):[];
    items=items.concat(its);
    sections.push({name:nameOf(s,id),items:its});
  });
  return {names:names,items:items,sections:sections};
}
function sectionsHTML(secs){
  return secs.map(function(sec){
    return (sec.name?'<div class="gtl">'+esc(sec.name)+'</div>':'')+'<ul class="lines" style="margin-bottom:0">'+sec.html+'</ul>';
  }).join('');
}
function logLines(items,s){
  var mk={done:'✓',partial:'½',skipped:'–'};
  return items.map(function(it){
    var l=s.logs[it.id]||{},note=String(l.note||'').trim();
    return '<li'+(l.status==='skipped'?' class="sk"':'')+'><span class="mk '+(l.status||'')+'">'+(mk[l.status]||'')+'</span><b>'+esc(it.label)+'</b>'+setsSpan(l)+(note?(hasSets(l)?'<span class="nt">,</span> ':' ')+'<span class="nt">'+esc(note)+'</span>':'')+'</li>';
  }).join('');
}

/* ───────── Workout (day view) ───────── */
function chev(dir){
  return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+(dir<0?'M15 5l-7 7 7 7':'M9 5l7 7-7 7')+'"/></svg>';
}
function todayView(){
  var d=ui.date,t=today(),isToday=d===t,ws=weekStart(d);
  var strip='';
  for(var i=0;i<7;i++){
    var dd=addDays(ws,i),dots='';
    sessionsOn(dd).forEach(function(s){dots+='<i class="dot '+s.status+'"></i>';});
    strip+='<button class="day'+(dd===d?' on':'')+(dd===t?' today':'')+'" data-act="pickDay" data-date="'+dd+'" aria-label="'+esc(fmtShort(dd))+'">'+
      '<span class="dn">'+DAYS[i]+'</span><span class="dd">'+fromISO(dd).getDate()+'</span><span class="dots">'+(dots||'&nbsp;')+'</span></button>';
  }
  var html='<div class="head"><h1>'+(isToday?'Today':esc(fmtShort(d)))+'</h1>'+
    '<div class="row">'+(isToday?'':'<button class="btn ghost" data-act="dateToday">Today</button>')+
    '<button class="btn ghost icon" data-act="dateShift" data-n="-7" aria-label="Previous week">'+chev(-1)+'</button>'+
    '<button class="btn ghost icon" data-act="dateShift" data-n="7" aria-label="Next week">'+chev(1)+'</button></div></div>';
  html+='<div class="strip">'+strip+'</div>';

  if(isToday){
    sessList().filter(function(s){return s.status==='open'&&s.date!==d;}).sort(byOrd).forEach(function(s){html+=sessionCard(s,true);});
  }
  var list=sessionsOn(d);
  list.forEach(function(s){html+=sessionCard(s,false);});

  if(d>t){
    html+='<p class="small muted">Future days can be logged once they arrive.</p>';
  }else if(!state.groups.length){
    html+='<div class="card"><b>Start by creating a group</b><p class="muted small" style="margin:6px 0 10px">A group is a set of exercises, like "Leg 1" or "Core". You add groups to each workout as you go.</p>'+
      '<button class="btn" data-act="tab" data-tab="groups">Go to Groups</button></div>';
  }else{
    if(!list.length){
      html+='<div class="card empty empty-day">'+
        '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>'+
        '<b>'+(isToday?'No workout yet today':'No workout logged')+'</b></div>'+
        '<button class="btn'+(isToday?'':' sec')+' block" data-act="startWorkout" data-date="'+d+'" style="margin:0 0 12px">'+(isToday?'Start workout':'Log a past workout')+'</button>';
    }else{
      html+='<button class="btn'+(isToday?'':' sec')+' block" data-act="startWorkout" data-date="'+d+'" style="margin:0 0 12px">'+(isToday?'Start another workout':'Log another workout')+'</button>';
    }
  }
  return html;
}
function sessionCard(s,showDate){
  var it=itemsOf(s),numbered=sessionsOn(s.date).length>1;
  return '<div class="card"><button style="display:block;width:100%;text-align:left" data-act="openSess" data-key="'+s.id+'">'+
    (s.status==='open'?'<span class="badge open fr">'+esc(STATUS_LABEL.open)+'</span>':'')+
    (numbered||showDate?'<div class="slot-h">'+(numbered?'<b>'+esc(labelFor(s))+'</b>':'')+(showDate?'<span class="small muted">'+esc(fmtMD(s.date))+'</span>':'')+'</div>':'')+
    (it.names.length?sectionsHTML(it.sections.map(function(sec){return {name:sec.name,html:logLines(sec.items,s)};})):'<p class="small muted" style="margin:0">No groups added yet.</p>')+
    (s.note?'<div class="sess-line m" style="margin-top:12px;color:var(--muted)">'+esc(s.note)+'</div>':'')+
    '</button></div>';
}

/* ───────── workout view ───────── */
function sess(){return ui.open?(state.sessions[ui.open]||null):null;}
function sessionView(){
  var s=sess();
  if(!s){ui.open=null;return todayView();}
  if(s.status==='open')refresh(s);
  var leaves=allLeaves(s);
  var logged=leaves.filter(function(l){return s.logs[l.id]&&s.logs[l.id].status;}).length;
  var pct=leaves.length?Math.round(100*logged/leaves.length):0;
  var names=s.groupIds.map(function(id){return nameOf(s,id);});
  var html='<div class="row between"><button class="btn ghost sm backb" data-act="back">'+chev(-1)+'Back</button>'+badgeHTML(s.status)+'</div>';
  var multi=sessionsOn(s.date).length>1;
  html+='<h1 style="margin-top:12px">'+(s.date===today()?'Today':esc(fmtShort(s.date)))+'</h1>';
  if(multi)html+='<div class="muted small" style="margin:-6px 0 12px">'+esc(labelFor(s))+'</div>';
  html+='<div class="progress" aria-label="'+logged+' of '+leaves.length+' logged"><i style="width:'+pct+'%"></i></div>';
  s.groupIds.forEach(function(id){
    var g=groupFor(s,id);
    if(!g)html+='<div class="card"><div class="row between"><span class="muted">'+esc(nameOf(s,id))+' was deleted from your library.</span><button class="link" data-act="grpRemove" data-node="'+id+'">Remove</button></div></div>';
    else html+=resNode(g,s,0,null);
  });
  if(!s.groupIds.length)html+='<div class="card empty">Add the groups you want to do today.</div>';
  html+='<div class="card"><h2>Workout notes</h2><textarea class="inp" data-in="snote">'+esc(s.note||'')+'</textarea></div>';
  html+='<button class="btn sec block" data-act="addGroupSheet" style="margin:0 0 12px">+ Add group</button>';
  html+='<div class="row wrap" style="margin-bottom:6px">';
  if(s.status==='open'){
    html+='<button class="btn full" data-act="finish">Finish workout</button>';
  }else{
    html+='<button class="btn full" data-act="back">Done</button>';
  }
  html+='</div><button class="link" data-act="discard">Discard this workout</button>';
  return html;
}
function resNode(node,s,depth,pinfo,pre){
  if(node.kind==='exercise')return exCard(node,s,pinfo);
  var kids=pickedKids(node,s.picks),cyc=node.mode==='cycle';
  var swap=pinfo?swapBtn(s,pinfo):'';
  /* "Main › A": a sub-group whose only pick is another sub-group shares one header with it instead of nesting a second one. */
  var label=(pre?pre+' \u203a ':'')+(node.name||'Untitled');
  if(depth>0&&!s.manual&&kids.length===1&&kids[0].kind==='group'){
    var kp=cyc?{cycle:node,id:kids[0].id}:pinfo;
    if(!(cyc&&swap&&swapBtn(s,kp)))return resNode(kids[0],s,depth,kp,label);
  }
  var canChoose=s.manual&&cyc&&node.children.length;
  var choose=(canChoose&&kids.length)?'<button class="link" data-act="pickKids" data-node="'+node.id+'">Choose</button>':'';
  /* A sub-group that resolves to a single exercise needs no header of its own: its name becomes a small label on the exercise. */
  if(depth>0&&!s.manual&&kids.length===1&&kids[0].kind==='exercise'){
    var inner=cyc?swapBtn(s,{cycle:node,id:kids[0].id}):'';
    if(!(inner&&swap)){
      var eyebrow=(node.name&&node.name!==kids[0].name)?label:'';
      /* At the card level, keep the same header strip as a multi-exercise sub-group so every sub-group looks alike. */
      if(depth===1&&eyebrow)return '<section class="gsec nested gcard"><div class="subhead"><span>'+esc(label)+'</span><span class="row" style="gap:0">'+(inner||swap)+'</span></div>'+
        '<div class="gbody">'+exCard(kids[0],s,null,'',' ')+'</div></section>';
      return exCard(kids[0],s,cyc?{cycle:node,id:kids[0].id}:pinfo,eyebrow,!inner&&swap?swap:'');
    }
  }
  var head;
  if(depth===0){
    head='<div class="gh"><h3>'+esc(node.name||'Untitled')+'</h3><span class="row" style="gap:0">'+choose+
      '<button class="link gmenu" aria-label="Group options" data-act="grpMenu" data-node="'+node.id+'">\u00b7\u00b7\u00b7</button></span></div>';
  }else head='<div class="subhead"><span>'+esc(label)+'</span><span class="row" style="gap:0">'+choose+swap+'</span></div>';
  var body=kids.map(function(c){return resNode(c,s,depth+1,cyc?{cycle:node,id:c.id}:null);}).join('');
  var empty=canChoose?'<button class="btn sec sm" data-act="pickKids" data-node="'+node.id+'">Choose what you did</button>':'<p class="muted small">Nothing in this group yet.</p>';
  var more='';
  if(!s.manual&&cyc&&node.pickMax&&node.pickMax>kids.length&&node.children.length>kids.length){
    more='<button class="btn sec sm" data-act="addAnother" data-node="'+node.id+'">+ Add another</button>';
  }
  /* Top-level group: a plain heading above its cards. Sub-group: one card of its own. "Add another" sits outside the card. */
  if(depth===1)return '<section class="gsec nested gcard">'+head+'<div class="gbody">'+(body||empty)+'</div></section>'+more;
  return '<section class="gsec'+(depth?' nested':' gtop')+'">'+head+(body||empty)+more+'</section>';
}
function swapBtn(s,pinfo){
  if(s.manual)return '';
  var cyc=pinfo.cycle,picked=s.picks[cyc.id]||[];
  var alts=cyc.children.filter(function(c){return picked.indexOf(c.id)<0;});
  var removable=picked.length>(cyc.pick||1);
  if(!alts.length&&!removable)return '';
  return '<button class="link swapb" aria-label="Change" title="Change" data-act="swap" data-node="'+cyc.id+'" data-child="'+pinfo.id+'">\u21c4</button>';
}
/* History chart: one point per earlier workout. Weighted exercises pick Top weight / Est. 1RM / Volume; holds pick Longest / Total;
   bodyweight rep exercises plot total reps. The choice (ui.histMode) is remembered while the app is open. */
var HM={
  top:{t:'Heaviest weight (lbs)',b:'Heaviest weight you lifted, and the reps you got at it.'},
  e1rm:{t:'Estimated 1RM (lbs)',b:'Strength of your best set, adjusted for reps.'},
  vol:{t:'Volume (lbs)',b:'Total work done in the workout. Skipped sets lower it.'},
  long:{t:'Longest hold',b:'Your best single hold.'},
  total:{t:'Total hold time',b:'Total time held across all sets.'},
  r:{t:'Total reps',b:'Total reps across all sets.'}
};
function niceTicks(lo,hi,isTime){
  var cands=isTime?[5,10,15,30,60,120,300,600,900,1800,3600]:[],step,out=[];
  if(!isTime)for(var e=-1;e<=6;e++)[1,2,2.5,5].forEach(function(m){cands.push(m*Math.pow(10,e));});
  cands.sort(function(x,y){return x-y;});
  /* smallest round step that gives at most 4 gridlines */
  step=cands.filter(function(c){return Math.floor(hi/c+1e-9)-Math.ceil(lo/c-1e-9)+1<=4;})[0]||cands[cands.length-1];
  for(var v=Math.ceil(lo/step-1e-9)*step;v<=hi+1e-9;v+=step)out.push(Math.round(v*100)/100);
  return out;
}
function fmtNum(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
function histChart(hh){
  var rows=hh.slice().reverse(),anyW=false,anyR=false,anyT=false;
  rows.forEach(function(h){(h.sets||[]).forEach(function(x){if(x.w>0)anyW=true;if(x.r!=null)anyR=true;if(x.t!=null)anyT=true;});});
  var kind=anyW?'w':anyR?'r':anyT?'t':'';
  if(!kind)return '';
  var opts=kind==='w'?[['top','Top weight'],['e1rm','Est. 1RM'],['vol','Volume']]:kind==='t'?[['long','Longest'],['total','Total']]:[['r','Reps']];
  var mode=opts.some(function(o){return o[0]===ui.histMode;})?ui.histMode:opts[0][0];
  var pts=[];
  rows.forEach(function(h){
    var v=null,lab='',sets=h.sets||[];
    if(mode==='top'){
      var best=null;
      sets.forEach(function(x){if(x.w>0&&(!best||x.w>best.w||(x.w===best.w&&(x.r||0)>(best.r||0))))best=x;});
      if(best){v=best.w;lab=fmtWt(best.w)+(best.r!=null?'×'+best.r:'');}
    }else if(mode==='e1rm'){
      var e=0;
      sets.forEach(function(x){if(x.w>0&&x.r>=1){var q=x.r>1?x.w*(1+x.r/30):x.w;if(q>e)e=q;}});
      if(e){v=e;lab=String(Math.round(e));}
    }else if(mode==='vol'){
      var vs=0;
      sets.forEach(function(x){if(x.w>0&&x.r>=1)vs+=x.w*x.r;});
      if(vs){v=vs;lab=fmtNum(vs);}
    }else if(mode==='r'){
      var sum=0,any=false;
      sets.forEach(function(x){if(x.r!=null){sum+=x.r;any=true;}});
      if(any){v=sum;lab=String(sum);}
    }else{
      var tt=0,mx=0;
      sets.forEach(function(x){if(x.t>0){tt+=x.t;if(x.t>mx)mx=x.t;}});
      v=mode==='long'?mx:tt;
      if(v)lab=fmtDur(v);else v=null;
    }
    if(v!=null)pts.push({date:h.date,day:fromISO(h.date).getTime()/864e5,v:v,lab:lab});
  });
  var ctl='<div class="cap">'+esc(HM[mode].b)+'</div>';
  if(opts.length>1)ctl='<div class="seg" role="group" aria-label="Chart metric">'+opts.map(function(o){
    return '<button data-act="histMode" data-m="'+o[0]+'" class="'+(o[0]===mode?'on':'')+'">'+o[1]+'</button>';}).join('')+'</div>'+ctl;
  if(pts.length<2)return '<div class="hchart">'+ctl+'<p class="small muted" style="margin:8px 0 0">Not enough logged sets to chart this yet.</p></div>';
  var W=358,H=138,L=44,R=28,T=14,B=24,pw=W-L-R,ph=H-T-B;
  var vmin=Math.min.apply(null,pts.map(function(p){return p.v;})),vmax=Math.max.apply(null,pts.map(function(p){return p.v;}));
  /* The axis never zooms tighter than ~28% of the top value, so a small change reads as a small slope. */
  var isT=(mode==='long'||mode==='total'),span=Math.max(vmax-vmin,0.28*vmax)*1.2,mid=(vmin+vmax)/2;
  var ylo=Math.max(0,mid-span/2),yhi=ylo+span,ticks=niceTicks(ylo,yhi,isT);
  var d0=pts[0].day,d1=pts[pts.length-1].day;
  var ip=22;   // points sit inside the gridlines so the first/last value labels clear the axis numbers
  function X(p){return d1>d0?L+ip+(pw-2*ip)*(p.day-d0)/(d1-d0):L+pw/2;}
  function Y(v){return T+ph*(1-(v-ylo)/(yhi-ylo));}
  function fy(v){return (mode==='long'||mode==='total')?fmtDur(v):mode==='top'?fmtWt(v):fmtNum(v);}
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(HM[mode].t+': '+fy(pts[0].v)+' on '+histDate(pts[0].date)+' to '+fy(pts[pts.length-1].v)+' on '+histDate(pts[pts.length-1].date))+'" font-family="inherit">';
  ticks.forEach(function(v){
    s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" style="stroke:var(--line)" stroke-width="1"/>'+
       '<text x="'+(L-6)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end" font-size="11" style="fill:var(--muted)">'+esc(fy(v))+'</text>';
  });
  s+='<polyline fill="none" style="stroke:var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="'+pts.map(function(p){return X(p).toFixed(1)+','+Y(p.v).toFixed(1);}).join(' ')+'"/>';
  pts.forEach(function(p){
    s+='<circle cx="'+X(p).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="4" style="fill:var(--accent);stroke:var(--card)" stroke-width="2"><title>'+esc(histDate(p.date)+': '+p.lab)+'</title></circle>';
  });
  /* value labels: last, highest, first, then the rest; skip any that would touch one already placed */
  var order=[],hi=pts.reduce(function(a,p){return p.v>a.v?p:a;},pts[0]);
  [pts[pts.length-1],hi,pts[0]].concat(pts.slice().reverse()).forEach(function(p){if(order.indexOf(p)<0)order.push(p);});
  var placed=[];
  order.forEach(function(p){
    var w=p.lab.length*6.4+8,x=X(p);
    if(placed.some(function(q){return Math.abs(q.x-x)<(q.w+w)/2;}))return;
    placed.push({x:x,w:w});
    s+='<text x="'+x.toFixed(1)+'" y="'+(Y(p.v)-9).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="600" style="fill:var(--text)">'+esc(p.lab)+'</text>';
  });
  s+='<text x="'+L+'" y="'+(H-6)+'" font-size="11" style="fill:var(--muted)">'+esc(histDate(pts[0].date))+'</text>'+
     '<text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end" font-size="11" style="fill:var(--muted)">'+esc(histDate(pts[pts.length-1].date))+'</text></svg>';
  return '<div class="hchart">'+ctl+s+'</div>';
}
function histWas(h,node){return h.name&&node&&h.name!==node.name?'('+h.name+') ':'';}
function histDate(iso){return iso.slice(0,4)!==today().slice(0,4)?fmtMD(iso)+' '+iso.slice(0,4):fmtMD(iso);}

    '<input class="inp" data-in="lognote" enterkeyhint="done" data-ex="'+node.id+'" value="'+esc(log.note||'')+'" placeholder="Notes">'+trendHTML+progHTML+'</div>';

/* ───────── Groups ───────── */
function pickStr(g){return (g.pick||1)+(g.pickMax&&g.pickMax>g.pick?'–'+g.pickMax:'');}
/* Lists in the Groups outline show the first two, then a muted "+N more" once there are more than three (the private-use markers become a span in txt()). */
function clipList(parts,cyc){return (parts.length>3?parts.slice(0,2).concat(['\uE000+'+(parts.length-2)+'\u00a0more\uE001']):parts).join(cyc?' / ':', ');}
function innerText(g){
  var cyc=g.mode==='cycle';
  var parts=g.children.map(function(c){return c.kind==='group'?(c.name||'Untitled')+' ('+innerText(c)+')':(c.name||'(unnamed)');});
  if(!parts.length)return 'empty';
  return (cyc&&(g.pick||1)>1?pickStr(g)+' of: ':'')+clipList(parts,cyc);
}
/* First line says how the group behaves; the rest list the exercises (no targets or form cues). */
/* "2–3 groups each workout, in order": groups when the choices are sub-groups, exercises when they are exercises. */
function rotLine(g){
  var one=(g.pick||1)===1&&!(g.pickMax>1);
  var ex=g.children.filter(function(c){return c.kind==='exercise';}).length;
  var noun=ex===g.children.length?'exercise':ex===0?'group':'item';
  return (one?'One '+noun:pickStr(g)+' '+noun+'s')+' each workout, in order';
}
function outlineLines(g){
  var n=g.children.length;
  if(!n)return [{head:true,t:'No exercises yet'}];
  var cyc=g.mode==='cycle',out=cyc?[{head:true,t:rotLine(g)}]:[];
  var run=[];
  function flush(){if(run.length){out.push({t:clipList(run,cyc)});run=[];}}
  g.children.forEach(function(c){
    if(c.kind==='exercise'){if(cyc)run.push(c.name||'(unnamed)');else out.push({t:c.name||'(unnamed)'});return;}
    flush();
    /* A rotation between sub-groups gets a line per option ("A  Squat") instead of everything on one line. */
    if(c.mode==='cycle'&&c.children.some(function(k){return k.kind==='group';})){
      var note=rotLine(c).replace(', in order','');
      out.push({n:c.name||'Untitled',note:note.charAt(0).toLowerCase()+note.slice(1),
        subs:c.children.map(function(k){return k.kind==='group'?{n:k.name||'Untitled',t:innerText(k)}:{n:'',t:k.name||'(unnamed)'};})});
      return;
    }
    out.push({n:c.name||'Untitled',t:innerText(c)});
  });
  flush();
  return out;
}
function groupsView(){

      (function(ol){
        var head=ol.filter(function(l){return l.head;}),items=ol.filter(function(l){return !l.head;});
        function mt(t){return esc(t).replace(/\uE000(.*?)\uE001/g,'<span class="muted">$1</span>');}
        function txt(l){
          if(l.subs)return esc(l.n)+' <span class="muted">\u00b7 '+esc(l.note)+'</span><div class="gsub">'+

          return (l.n?esc(l.n)+' \u203a ':'')+mt(l.t);

        else if(items.length)h+='<div class="small" style="margin-top:8px">'+txt(items[0])+'</div>';
        return h;
      })(outlineLines(g))+'</button></div>';

/* ───────── Group view (read-only) ─────────
   What you see on tapping a group, before opening it to edit: how it behaves, what its rotations give next,
   and how each exercise went last time. Everything is read from the live group and from finished workouts. */
function daysAgo(iso){return Math.round((fromISO(today())-fromISO(iso))/864e5);}
function agoText(iso){
  var n=daysAgo(iso);
  if(n<=0)return 'Today';
  if(n===1)return 'Yesterday';
  if(n<14)return n+' days ago';
  if(n<60)return Math.round(n/7)+' weeks ago';
  return Math.round(n/30)+' months ago';
}
function groupRuns(g){
  return sessList().filter(function(s){return s.status==='done'&&s.groupIds.indexOf(g.id)>=0;}).sort(function(a,b){return b.ord-a.ord;});
}
function groupStats(g){
  var runs=groupRuns(g);
  if(!runs.length)return 'Not done yet';
  var parts=['Last done '+agoText(runs[0].date).toLowerCase()];
  var cut=addDays(today(),-30),n30=runs.filter(function(s){return s.date>cut;}).length;
  parts.push(n30+(n30===1?' time':' times')+' in the last 30 days');
  var dates=[];
  runs.forEach(function(s){if(dates.indexOf(s.date)<0)dates.push(s.date);});
  if(dates.length>=4){
    var k=Math.min(dates.length,8)-1,gap=Math.max(1,Math.round((daysAgo(dates[k])-daysAgo(dates[0]))/k));
    parts.push('about every '+(gap===1?'day':gap+' days'));
  }
  return parts.join(' · ');
}
/* Every finished workout that logged this exercise (any status), newest first, in the same shape history() returns. */
function doneHist(exId){
  return sessList().filter(function(s){
    var l=s.logs&&s.logs[exId];return s.status==='done'&&l&&(trendText(l)||l.status);
  }).sort(function(a,b){return b.ord-a.ord;}).map(function(s){
    var l=s.logs[exId];
    return {date:s.date,note:trendText(l),status:l.status||'',name:l.name||'',sets:setsOf(s,exId)};
  });
}
function hasCycle(n){return n.kind==='group'&&(n.mode==='cycle'||n.children.some(hasCycle));}
/* A workout from today that is still open and has this group in it: its picks are what the group is doing right now. */
function liveRun(g){
  var r=sessList().filter(function(s){return s.status==='open'&&!s.manual&&s.groupIds.indexOf(g.id)>=0;}).sort(byOrd);
  return r.length?r[r.length-1]:null;
}
/* Tiny trend line: heaviest weight, else total reps, else longest hold. Same "don't exaggerate small changes" axis as the history chart. */
function sparkHTML(rows){
  var anyW=false,anyR=false,anyT=false;
  rows.forEach(function(h){(h.sets||[]).forEach(function(x){if(x.w>0)anyW=true;if(x.r!=null)anyR=true;if(x.t!=null)anyT=true;});});
  var kind=anyW?'w':anyR?'r':anyT?'t':'';
  if(!kind)return '';
  var vals=rows.slice(0,8).reverse().map(function(h){
    var sets=h.sets||[],v=null;
    sets.forEach(function(x){
      if(kind==='w'){if(x.w>0&&(v==null||x.w>v))v=x.w;}
      else if(kind==='r'){if(x.r!=null)v=(v||0)+x.r;}
      else if(x.t>0&&(v==null||x.t>v))v=x.t;
    });
    return v;
  }).filter(function(v){return v!=null;});
  if(vals.length<3)return '';
  var W=56,H=18,lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals);
  if(lo===hi)return '';   // a flat line says nothing the numbers don't
  var sp=Math.max(hi-lo,0.28*hi)*1.2||1,ylo=(lo+hi)/2-sp/2;
  var pts=vals.map(function(v,i){return [2+(W-4)*i/(vals.length-1),H-3-(H-6)*(v-ylo)/sp];});
  var last=pts[pts.length-1];
  return '<svg class="spark" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" aria-hidden="true">'+
    '<polyline fill="none" style="stroke:var(--accent)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" points="'+pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ')+'"/>'+
    '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="2.2" style="fill:var(--accent)"/></svg>';
}

function vKids(node,picks,tag){

/* Top level, laid out like the editor: runs of plain exercises share a card, each sub-group gets its own. */
function vRoot(g,picks,tag){

/* Progression notes: free text, a few lines. Collapsed to a quiet link until there is something to say. */
function progField(node){
  if(String(node.prog||'').trim()||ui.progOpen[node.id])
    return '<div class="row sub"><textarea class="inp sm prog" rows="3" data-in="prog" data-node="'+node.id+'" placeholder="Progression notes" aria-label="Progression notes">'+esc(node.prog||'')+'</textarea></div>';
  return '<div class="sub"><button class="link" style="padding-left:0" data-act="addProg" data-node="'+node.id+'">+ Add progression notes</button></div>';
}
function settingsHTML(node){
  var cyc=node.mode==='cycle';
  var h='<div class="row sub"><span class="small muted lbl">Each workout</span><div class="seg" role="group">'+
    '<button data-act="mode" data-node="'+node.id+'" data-mode="all" class="'+(!cyc?'on':'')+'">Do all</button>'+
    '<button data-act="mode" data-node="'+node.id+'" data-mode="cycle" class="'+(cyc?'on':'')+'">Rotate</button></div></div>';
  if(cyc){
    h+='<div class="row sub"><span class="small muted lbl">Pick</span><input class="inp num sm" inputmode="numeric" data-ch="pick" data-node="'+node.id+'" value="'+(node.pick||1)+'" aria-label="Pick count">'+
      '<span class="small muted">up to</span><input class="inp num sm" inputmode="numeric" data-ch="pickMax" data-node="'+node.id+'" value="'+(node.pickMax||'')+'" placeholder="same" aria-label="Maximum pick count"></div>';
  }
  return h;
}
function addBtns(node,noEx,outside){
  var id=' data-node="'+node.id+'"';
  if(outside)return (noEx?'':'<button class="btn sec block" style="margin:0 0 12px" data-act="addEx"'+id+'>+ Add exercise</button>')+
    '<button class="btn sec block" style="margin:0 0 12px" data-act="addGrp"'+id+'>+ Add sub-group</button>';
  return '<div class="row sub" style="margin-top:10px">'+(noEx?'':'<button class="btn sec sm" data-act="addEx"'+id+'>+ Exercise</button>')+'<button class="btn sec sm" data-act="addGrp"'+id+'>+ Sub-group</button></div>';
}
/* A sub-group's contents: exercise rows separated by hairlines, deeper sub-groups indented under one accent line. */
function bodyHTML(node){
  return node.children.map(function(c){return c.kind==='exercise'?exRow(c):groupBlock(c,true);}).join('');
}
function groupBlock(node,nested){
  return '<div class="'+(nested?'nest':'card')+'"><div class="row"><input class="inp grow" style="font-weight:700" data-in="name" data-node="'+node.id+'" value="'+esc(node.name)+'" placeholder="Sub-group name">'+ctl(node)+'</div>'+
    settingsHTML(node)+'<div style="margin-top:32px">'+bodyHTML(node)+'</div>'+addBtns(node)+'</div>';
}
/* Top-level group: a settings card, then one card per sub-group (runs of plain exercises share a card). */
function editRoot(node){
  var h='<div class="card"><input class="inp" style="font-weight:700" data-in="name" data-node="'+node.id+'" value="'+esc(node.name)+'" placeholder="Group name">'+
    '<div class="row sub"><span class="small muted lbl">Abbreviation</span><input class="inp num sm" maxlength="3" data-in="abbr" data-node="'+node.id+'" value="'+esc(node.abbr||'')+'" aria-label="Abbreviation, up to 3 characters"></div>'+
    settingsHTML(node)+'</div>';
  var run=[];
  var last=node.children[node.children.length-1];
  var trailing=!!last&&last.kind==='exercise';   // exercises run to the end: "+ Exercise" lives in that card
  function flush(end){
    if(!run.length)return;
    h+='<div class="card">'+run.map(exRow).join('')+(end&&trailing?'<div class="row"><button class="btn sec sm" data-act="addEx" data-node="'+node.id+'">+ Exercise</button></div>':'')+'</div>';
    run=[];
  }
  node.children.forEach(function(c){
    if(c.kind==='exercise'){run.push(c);return;}
    flush(false);h+=groupBlock(c,false);
  });
  flush(true);
  return h+addBtns(node,trailing,true);
}

/* ───────── History ───────── */
function hasFilter(){return Object.keys(ui.filter).some(function(k){return ui.filter[k];});}
function calCell(d){
  var codes='',dot='',ss=sessionsOn(d);
  ss.forEach(function(s){
    if(!s.groupIds.length){dot='<i class="cd '+s.status+'"></i>';return;}
    s.groupIds.forEach(function(id){
      var g=groupFor(s,id),code=g?abbrOf(g):((s.snap&&s.snap[id]&&s.snap[id].abbr)||'');
      if(code){if(!hasFilter()||ui.filter[id])codes+='<i class="cg '+s.status+'">'+esc(code)+'</i>';}
      else dot='<i class="cd '+s.status+'"></i>';
    });
  });
  var t=today();
  var label=fmtShort(d)+(ss.length?': '+ss.map(function(s){return (s.groupNames||[]).join(' + ')+' ('+(STATUS_LABEL[s.status]||s.status).toLowerCase()+')';}).join(', '):': nothing logged');
  return '<button class="cal-c'+(d===t?' today':'')+(d>t?' future':'')+'" data-act="calDay" data-date="'+d+'" aria-label="'+esc(label)+'">'+
    '<span class="cn">'+(fromISO(d).getDate()===1?esc(fmtMD(d)):fromISO(d).getDate())+'</span><span class="cc">'+codes+'</span>'+dot+'</button>';
}
function calendarHTML(){
  var t=today(),cur=weekStart(t),n=ui.weeks||5;
  var html='<div class="cal" role="group" aria-label="Calendar">'+['S','M','T','W','T','F','S'].map(function(x){return '<span class="hd">'+x+'</span>';}).join('');
  for(var w=n-1;w>=0;w--){
    var ws=addDays(cur,-7*w);
    for(var i=0;i<7;i++)html+=calCell(addDays(ws,i));
  }
  html+='</div>';
  /* The legend explains the codes actually on screen, including groups since deleted from the library. */
  var seen={},order=[];
  for(var w2=n-1;w2>=0;w2--){
    var ws2=addDays(cur,-7*w2);
    for(var i2=0;i2<7;i2++)sessionsOn(addDays(ws2,i2)).forEach(function(s){
      s.groupIds.forEach(function(id){
        if(seen[id])return;
        var g=groupFor(s,id),code=g?abbrOf(g):((s.snap&&s.snap[id]&&s.snap[id].abbr)||'');
        if(!code)return;
        seen[id]={code:code,name:nameOf(s,id)};order.push(id);
      });
    });
  }
  Object.keys(ui.filter).forEach(function(k){if(!seen[k])delete ui.filter[k];});
  var lg=order.map(function(id){return '<button class="lchip'+(ui.filter[id]?' on':'')+'" aria-pressed="'+(ui.filter[id]?'true':'false')+'" data-act="toggleFilter" data-id="'+id+'"><b>'+esc(seen[id].code)+'</b> '+esc(seen[id].name)+'</button>';}).join('');
  html+='<div class="legend">'+lg+'</div>';
  return html;
}
function historyView(){
  var all=sessList().sort(function(a,b){return b.ord-a.ord;});
  var html='<div class="head"><h1>History</h1><button class="btn ghost sm" data-act="calMore">Show more</button></div>';
  html+=calendarHTML();
  var filt=hasFilter();
  var list=all.filter(function(s){return s.groupIds.length&&s.status==='done'&&(!filt||s.groupIds.some(function(id){return ui.filter[id];}));}).slice(0,60);
  if(!list.length)html+='<div class="card empty">'+(filt?'No past workouts match.':'Past workouts show up here.')+'</div>';
  else html+='<h2 style="margin:16px 0 8px">Past workouts</h2>';
  var mark={done:'✓',partial:'½',skipped:'–'};
  list.forEach(function(s){
    var logs=s.logs||{};
    var used={};
    var nm={};
    function entry(id){var l=logs[id];return '<li'+(l.status==='skipped'?' class="sk"':'')+'><span class="mk '+(l.status||'')+'">'+(mark[l.status]||'')+'</span><b>'+esc(nm[id]||l.name||'')+'</b>'+setsSpan(l)+(String(l.note||'').trim()?(hasSets(l)?'<span class="nt">,</span> ':' ')+'<span class="nt">'+esc(String(l.note).trim())+'</span>':'')+'</li>';}
    function logged(id){var l=logs[id];return l&&(l.status||String(l.note||'').trim()||hasSets(l));}
    var secs=[];
    s.groupIds.forEach(function(id){
      var g=groupFor(s,id),lv=g?leavesOf(g,s.picks):[];
      lv.forEach(function(l){nm[l.id]=l.name;});
      var ids=lv.map(function(l){return l.id;}).filter(logged);
      ids.forEach(function(x){used[x]=1;});
      if(ids.length)secs.push({name:nameOf(s,id),html:ids.map(entry).join('')});
    });
    var rest=Object.keys(logs).filter(function(id){return !used[id]&&logged(id);});
    if(rest.length)secs.push({name:'',html:rest.map(entry).join('')});
    html+='<div class="card"><button style="display:block;width:100%;text-align:left" data-act="openFromHistory" data-key="'+s.id+'">'+
      '<span class="hdate">'+esc(fmtShort(s.date))+'</span>'+(s.status==='open'?'<div class="slot-h">'+badgeHTML(s.status)+'</div>':'')+
      sectionsHTML(secs)+
      (s.note?'<div class="sess-line m" style="margin-top:12px;color:var(--muted)">'+esc(s.note)+'</div>':'')+'</button></div>';
  });
  return html;
}

/* ───────── Settings ───────── */
function fmtBytes(n){
  if(n<1024)return n+' B';
  if(n<1048576)return (n/1024).toFixed(n<10240?2:1)+' KB';
  return (n/1048576).toFixed(2)+' MB';
}
function sizeLine(){
  var n=0;
  try{n=new Blob([JSON.stringify(state)]).size;}catch(e){return '';}
  var w=Object.keys(state.sessions).length,g=state.groups.length;
  return '<p class="small" style="margin:0 0 10px"><b>Data size</b> '+fmtBytes(n)+
    '<span class="muted"> · '+w+' workout'+(w===1?'':'s')+', '+g+' group'+(g===1?'':'s')+'</span></p>';
}

    '<label class="fld" for="sync-gist">Gist ID</label>'+
    '<input class="inp" id="sync-gist" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" value="'+esc(sync.gist)+'" placeholder="Leave blank to create one on first sync">'+
    '<div class="row wrap" style="margin-top:12px"><button class="btn grow" data-act="syncSave">'+(on?'Save and sync now':'Connect and sync')+'</button>'+
    (on?'<button class="btn ghost" data-act="syncDisconnect">Disconnect</button>':'')+'</div>'+
    (on&&sync.gist?'<p class="small" style="margin:12px 0 0"><a class="link" style="padding:0" href="https://gist.github.com/'+esc(sync.gist)+'" target="_blank" rel="noopener">Open the gist on GitHub</a></p>':'')+
    (on?'':'<div class="hint" style="margin-top:14px"><b>Setup</b><ol class="steps"><li>On GitHub: Settings › Developer settings › Personal access tokens › Fine-grained tokens › Generate new token.</li><li>Under Account permissions, set <b>Gists</b> to Read and write. No repository access is needed.</li><li>Choose an expiry (or none), generate, and paste the token above.</li></ol></div>')+

  html+='<div class="card"><h2>Workout timer</h2>'+

    '<div class="row between" style="margin-top:10px"><span>Sound</span><div class="seg" role="group"><button data-act="prefSound" data-v="1" class="'+(prefs.sound?'on':'')+'">On</button><button data-act="prefSound" data-v="0" class="'+(prefs.sound?'':'on')+'">Off</button></div></div>'+
    '<div class="row between" style="margin-top:10px"><span>Keep screen on during workouts</span><div class="seg" role="group"><button data-act="prefWake" data-v="1" class="'+(prefs.wake?'on':'')+'">On</button><button data-act="prefWake" data-v="0" class="'+(prefs.wake?'':'on')+'">Off</button></div></div>'+
    '<p class="small muted" style="margin:10px 0 0">'+('wakeLock' in navigator?'Keeping the screen on is available on this device.':'This browser cannot keep the screen on.')+' These settings stay on this device.</p>'+
    '<button class="btn sec sm" style="margin-top:12px" data-act="testSound">Test sound</button></div>';
  html+='<div class="card"><h2>App</h2><p class="small muted">After you deploy a new version, tap Reload to load it. Your data is saved (and synced, if cloud sync is on) first.</p>'+
